<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>あとこれ｜家族準備の試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf7f4;color:#3e3835;font:16px/1.55 system-ui,sans-serif}main{max-width:560px;margin:auto;padding:16px}h1{font-size:23px;margin:8px 0}h2{font-size:17px;margin:0 0 12px}p{margin:6px 0}small{color:#72645c}section{background:white;border:1px solid #e6dcd6;border-radius:16px;padding:14px;margin:12px 0}button,select{font:inherit;min-height:44px;border-radius:10px;border:1px solid #d6ccc6;background:white;padding:8px 12px;color:inherit}button{cursor:pointer}button.primary{background:#477760;color:white;border:0}button:disabled{opacity:.6;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #477760;outline-offset:2px}label.check{display:flex;gap:9px;align-items:center;min-height:44px}input[type=checkbox]{width:21px;height:21px;flex:none;accent-color:#477760}.item{border-top:1px solid #eee5df;padding:10px 0;overflow-wrap:anywhere}.item:first-child{border:0}.split{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.muted{color:#76665d}.danger{color:#a33536;font-weight:650}.good{color:#346a52;font-weight:650}#notice{min-height:24px}#notice:empty{display:none}progress{width:100%;accent-color:#477760}.tag{font-size:13px;background:#f4e6df;padding:4px 8px;border-radius:7px}footer{font-size:13px;color:#76665d} 
</style></head><body><main><span class="tag">非公開・合成データの試作</span><h1>明日の準備、あとこれ。</h1><p><small>実際の購入、通知、家族共有、端末データへの保存は行いません。</small></p>
<section><div class="split"><h2>11月25日（水）の持ち物</h2><select id="child" aria-label="表示する子ども"><option value="all">ふたり分</option><option value="a">お兄ちゃん</option><option value="b">弟くん</option></select></div><progress id="progress" max="1" value="0" aria-label="準備の進み具合"></progress><p id="progressText" aria-live="polite"></p><div id="kit"></div></section>
<section><h2>買い足すもの</h2><div id="shortages"></div><button type="button" id="queue" class="primary">不足を買い物に追加</button></section>
<section><div class="split"><h2>家族の買い物</h2></div><p><small>操作する人（試作の切替）</small></p><select id="actor" aria-label="操作する家族"><option value="mama">ママ</option><option value="papa">パパ</option></select><div class="split"><select id="filter" aria-label="購入担当で絞り込み"><option value="all">すべて</option><option value="papa">パパ担当</option><option value="mama">ママ担当</option><option value="none">担当未設定</option></select></div><div id="shopping"></div><p id="notice" role="status"></p></section>
<footer>これは操作性検証用です。通知表示はシミュレーションのみ。準備チェックだけでは在庫を減らしません。</footer></main>
<script src="../atokore-live-v125/family-prep-v51.js"></script>
<script>
'use strict';
(() => {
const core=window.AtokorePrepProposal;
if(!core){document.querySelector('#notice').textContent='試作ロジックを読み込めません。';return;}
const $=id=>document.getElementById(id), date='2026-11-25';
const row=(id,name,stockId,unit,required)=>({id,name,stockId,unit,required});
const profiles=[{id:'a',week:{3:[row('diaper','おむつ L','l','枚',4),row('towel','タオル','t','枚',1)]}},{id:'b',week:{3:[row('diaper','おむつ M','m','枚',5),row('wipes','おしりふき','w','個',1)]}}];
const rows=core.planDay(profiles,date),done=new Set(),thanks=new Set();
const stocks=[{id:'l',name:'おむつ L',qty:3,unit:'枚'},{id:'m',name:'おむつ M',qty:2,unit:'枚'},{id:'t',name:'タオル',qty:2,unit:'枚'},{id:'w',name:'おしりふき',qty:1,unit:'個'}];
let buys=[],completed=[],seq=0;
const members=[{id:'mama',householdId:'demo',active:true},{id:'papa',householdId:'demo',active:true}], who=id=>id==='papa'?'パパ':'ママ';
function node(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
function status(s){$('notice').textContent=s}
function render(){
 const visible=rows.filter(r=>$('child').value==='all'||$('child').value===r.profileId);
 $('progress').max=visible.length||1;$('progress').value=visible.filter(r=>done.has(r.instanceId)).length;
 $('progressText').textContent=$('progress').value+'/'+visible.length+' 準備済み';
 $('kit').replaceChildren();
 visible.forEach(r=>{const l=node('label',null,'check'),c=node('input');c.type='checkbox';c.checked=done.has(r.instanceId);c.addEventListener('change',()=>{if(c.checked)done.add(r.instanceId);else done.delete(r.instanceId);render()});l.append(c,node('span',(r.profileId==='a'?'兄：':'弟：')+r.name+' '+r.required+r.unit));$('kit').append(l)});
 const plan=core.shortagePlan(rows,stocks,buys);
 $('shortages').replaceChildren();
 for(const x of plan.items){const e=node('div',null,'item');e.append(node('strong',x.name),node('p','必要 '+x.required+x.unit+' / 在庫 '+x.available+x.unit,'muted'),node('p',x.status==='enough'?'在庫あり':x.status==='queued'?'購入予定あり・まだ不足':x.status==='shortage'?'あと '+x.additional+x.unit+' を買い物に追加':'確認が必要',x.status==='enough'?'good':'danger'));$('shortages').append(e)}
 $('queue').disabled=!plan.items.some(x=>x.status==='shortage'&&x.additional>0);
 $('shopping').replaceChildren();
 for(const b of buys.filter(b=>$('filter').value==='all'||$('filter').value===(b.assigneeId||'none'))){
 const e=node('div',null,'item');e.append(node('strong',b.name+' '+b.qty+b.unit));
 const actor=$('actor').value;
 const controls=node('div',null,'split'),sel=node('select');sel.setAttribute('aria-label',b.name+'の担当');
 for(const [v,l] of [['none','担当未設定'],['papa','パパ'],['mama','ママ']]){const o=node('option',l);o.value=v;sel.append(o)}sel.value=b.assigneeId||'none';
 sel.addEventListener('change',()=>{const p=core.assignmentPlan({householdId:'demo',buyId:b.id,actorId:actor,assigneeId:sel.value==='none'?null:sel.value,currentAssigneeId:b.assigneeId,revision:b.revision,members});if(p.status==='ready'){b.assigneeId=p.assigneeId;b.revision=p.revision;b.requesterId=actor;b.response=p.event?'pending':p.assigneeId?'accepted':null;status(p.event?'通知のイメージ：'+who(p.assigneeId)+'に買い物のお願い（送信なし）':'担当を変更しました')}render()});
 if(b.response)e.append(node('p',b.response==='pending'?'返事待ち':b.response==='declined'?'担当を再確認してください':'引き受け済み','muted'));
 if(b.response==='pending'&&b.assigneeId===actor){const r=b.revision;for(const [decision,label] of [['accept','買えるよ'],['decline','今回は難しい']]){const answer=node('button',label);answer.type='button';answer.addEventListener('click',()=>{if(!buys.includes(b))return;const q=core.assignmentResponsePlan({householdId:'demo',buyId:b.id,actorId:actor,assigneeId:b.assigneeId,requesterId:b.requesterId,revision:b.revision,expectedRevision:r,response:b.response,decision,members});if(q.status==='ready'){b.revision=q.revision;b.assigneeId=q.assigneeId;b.response=q.response;status('返事の通知イメージ（送信なし）：'+(decision==='accept'?'買えるよ':'今回は難しい'))}render()});controls.append(answer)}}
 const button=node('button','買った','primary');button.type='button';button.disabled=!!b.assigneeId&&b.assigneeId!==actor;button.addEventListener('click',()=>{if(!buys.includes(b)||b.assigneeId&&b.assigneeId!==actor)return;const s=stocks.find(x=>x.id===b.stockId&&x.unit===b.unit);if(!s)return;s.qty+=b.qty;buys=buys.filter(x=>x!==b);completed.push({...b,purchasedBy:actor});status('合成在庫に補充しました。実データは変更していません。');render()});controls.append(sel,button);e.append(controls);$('shopping').append(e)}
 if(!buys.length)$('shopping').append(node('p','購入予定なし','muted'));
 for(const b of completed){const e=node('div',null,'item split'),button=node('button',thanks.has(b.id)?'ありがとう済み':'ありがとう');button.type='button';button.disabled=thanks.has(b.id)||b.purchasedBy===$('actor').value;button.addEventListener('click',()=>{if(b.purchasedBy===$('actor').value||thanks.has(b.id))return;thanks.add(b.id);status('ありがとうの表示例（送信なし）');render()});e.append(node('span',b.name+' 購入済み','good'),button);$('shopping').append(e)}
}
$('queue').addEventListener('click',()=>{const p=core.shortagePlan(rows,stocks,buys);for(const x of p.items.filter(x=>x.status==='shortage'&&x.additional>0)){buys.push({id:'demo-'+(++seq),stockId:x.stockId,name:x.name,qty:x.additional,unit:x.unit,assigneeId:null,revision:0})}status('不足分を購入予定へ追加しました');render()});$('child').addEventListener('change',render);$('filter').addEventListener('change',render);$('actor').addEventListener('change',()=>{status('');render()});render();
})();
</script></body></html>
