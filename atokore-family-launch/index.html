<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あとこれ</title><style>html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}#app{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="app" title="あとこれ"></iframe><script>(()=>{const base='https://raw.githack.com/rodaisuki1023-alt/ig-public-assets/main/atokore-live-v125/index.html';const family='https://raw.githack.com/rodaisuki1023-alt/ig-public-assets/main/atokore-trial-v12/family.js';const frame=document.getElementById('app');frame.src=base+location.search;frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=w.document;if(!d.getElementById('atokoreFamilySafeInjected')){const s=d.createElement('script');s.id='atokoreFamilySafeInjected';s.src=family;s.onload=()=>{w.shareFamilySafe=async()=>{let cfg=null;try{cfg=JSON.parse(w.localStorage.getItem('atokoreFamilySafeV2')||'null')}catch(e){}if(!cfg)return;const url=location.origin+location.pathname+'?family='+encodeURIComponent(cfg.familyCode);const text=`あとこれの家族共有コード：${cfg.familyCode}\n${url}`;try{if(w.navigator.share)await w.navigator.share({title:'あとこれ 家族共有',text,url});else{await w.navigator.clipboard.writeText(text);w.alert('共有内容をコピーしました')}}catch(e){}}};d.body.appendChild(s)}}catch(e){console.error('family launcher',e)}})})();</script></body></html>
