<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あとこれ v8</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f4f6f9;color:#172033}.loading{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:100%;padding:22px;border:1px solid #e5e7eb;border-radius:18px;box-sizing:border-box}.bar{height:8px;border-radius:999px;background:#e9eef5;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;width:72%;background:#1677ff;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}</style></head><body><div class="loading"><div class="card"><b>あとこれ v8 を読み込み中…</b><div style="font-size:13px;color:#667085;margin-top:8px">在庫・買い物・実レシートOCR・表示サイズ設定を準備しています。</div><div class="bar"><i></i></div><div id="err" style="font-size:12px;color:#b42318;margin-top:12px"></div></div></div><script>
(async()=>{const base='https://raw.githubusercontent.com/rodaisuki1023-alt/ig-public-assets/main/';const get=async p=>{const r=await fetch(base+p+'?v=8',{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()};try{let [html,receipt,display]=await Promise.all([get('atokore-trial-v6/index.html'),get('atokore-trial-v7/receipt.js'),get('atokore-trial-v8/display.js')]);html=html.replace(/あとこれ 試用版 v6/g,'あとこれ 試用版 v8').replace(/試用版 v6/g,'試用版 v8').replace(/デモ解析→在庫反映/g,'写真をOCR解析→確認→在庫反映');const safe=s=>s.replace(/<\/script>/gi,'<\\/script>');const extra='<script>'+safe(receipt)+'<\/script><script>'+safe(display)+'<\/script>';document.open();document.write(html.replace('</body>',extra+'</body>'));document.close()}catch(e){console.error(e);document.getElementById('err').textContent='読み込みに失敗しました: '+e.message}})();
</script></body></html>
