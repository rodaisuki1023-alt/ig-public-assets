<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あとこれ 試用版</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#172033}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:84px}.top{position:sticky;top:0;z-index:9;padding:14px 16px;background:#fff;border-bottom:1px solid #eee}.top h1{margin:0;font-size:21px}.sub{font-size:12px;color:#667085}.content{padding:14px}.page{display:none}.page.on{display:block}.hero{padding:18px;border-radius:20px;background:linear-gradient(135deg,#eef6ff,#f9fbff);border:1px solid #dceaff}.hero.warn{background:linear-gradient(135deg,#fff7e8,#fffdf8);border-color:#f5d28a}.eyebrow{font-size:12px;font-weight:800;color:#1677ff}.hero h2{font-size:24px;margin:5px 0}.muted{font-size:12px;color:#667085}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{border:1px solid #e5e7eb;border-radius:15px;padding:10px;text-align:center;background:#fff}.metric b{font-size:22px;display:block}.section{font-weight:900;margin:18px 0 9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button,.btn,.chip,.product,.icon,.textbtn{border:0;font:inherit}.quick button{padding:12px 6px;border:1px solid #e5e7eb;border-radius:15px;background:#fff;font-weight:800}.quick strong{display:block;font-size:23px}.row{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:15px;padding:11px;margin:8px 0;background:#fff}.grow{flex:1;min-width:0}.name{font-weight:850}.meta{font-size:12px;color:#667085}.icon{width:38px;height:38px;border-radius:11px;background:#eef2f7;font-size:19px}.qty{display:flex;align-items:center;gap:6px}.qty b{min-width:44px;text-align:center}.btn{background:#1677ff;color:#fff;padding:11px 13px;border-radius:12px;font-weight:850}.ghost{background:#eef2f7;color:#25324a}.danger{background:#fff0f0;color:#b42318}.field{margin:11px 0}.label{font-size:13px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:12px;font-size:16px;background:#fff}.chips{display:flex;gap:7px;overflow:auto;margin:8px 0}.chip{white-space:nowrap;padding:8px 11px;border:1px solid #dfe4ea;border-radius:999px;background:#fff}.chip.on{background:#1677ff;color:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:7px}.product{text-align:left;padding:10px;border:1px solid #dfe4ea;border-radius:11px;background:#fff}.chosen{padding:10px;border-radius:12px;background:#eef6ff;border:1px solid #bed8ff;display:flex;justify-content:space-between;align-items:center}.hide{display:none}.detail{border:1px solid #e5e7eb;border-radius:14px;padding:10px;background:#fbfcfe}.detail summary{font-weight:850;cursor:pointer}.premium{background:linear-gradient(135deg,#faf7ff,#eef5ff);border:1px solid #d9ceff}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:20}.tab{border:0;background:none;padding:6px 2px;color:#667085;font-size:11px}.tab b{display:block;font-size:20px}.tab.on{color:#1677ff}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{width:min(480px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 26px}.empty{padding:14px;border:1px dashed #d6dbe3;border-radius:14px;text-align:center;color:#667085;font-size:13px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#efe7ff;color:#6f42c1;font-weight:850}.close{float:right;border:0;background:#eef2f7;border-radius:10px;padding:7px 10px}</style></head><body><div class="app"><header class="top"><h1>あとこれ <span class="badge">試用版</span></h1><div class="sub">家庭のストックを、できるだけ簡単に</div></header><main class="content"><section id="home" class="page on"><div id="hero" class="hero"><div class="eyebrow">今日のあとこれ</div><h2 id="heroTitle">今日は急ぎなし</h2><div id="heroText" class="muted">ストックは落ち着いています。</div></div><div class="metrics"><button class="metric" onclick="go('stock')">⏰<b id="mExp">0</b><span class="muted">期限近い</span></button><button class="metric" onclick="go('buy')">🛒<b id="mBuy">0</b><span class="muted">買うもの</span></button><button class="metric" onclick="premium('predict')">✦<b id="mPred">0</b><span class="muted">そろそろ</span></button></div><div class="section">すぐやる</div><div class="quick"><button onclick="go('add')"><strong>＋</strong>ストック追加</button><button onclick="go('buy')"><strong>🛒</strong>買い物メモ</button><button onclick="premium('receipt')"><strong>🧾</strong>レシート補充</button></div><div id="urgentSec"><div class="section">今日優先</div><div id="urgent"></div></div><div class="section">そろそろ買い時 <span class="badge">Premium</span></div><div id="predHome"></div></section><section id="stock" class="page"><div class="field"><input id="search" placeholder="品名を検索" oninput="renderStock()"></div><div id="catChips" class="chips"></div><div id="stockList"></div></section><section id="add" class="page"><div class="section">商品を追加</div><div class="field"><div class="label">カテゴリー</div><select id="cat" onchange="renderProducts()"><option>食料品</option><option>日用品</option><option>衛生・薬</option><option>ベビー</option><option>子ども</option><option>衣類</option><option>家電・生活用品</option><option>防災</option></select></div><div class="field"><div class="label">商品検索 / 手動入力</div><input id="name" placeholder="例：牛乳、オムツ" oninput="renderProducts();autoUnit()"></div><div id="chosen" class="hide"></div><div id="products" class="products"></div><div class="field"><div class="label">個数・数量</div><input id="num" type="number" min="0" step="1" value="1"></div><div class="field"><div class="label">単位</div><select id="unit"><option>個</option><option>本</option><option>袋</option><option>箱</option><option>パック</option><option>枚</option><option>g</option><option>kg</option><option>ml</option><option>L</option></select></div><div class="field"><div class="label">期限の種類</div><select id="expType" onchange="toggleExp()"><option>期限なし</option><option>賞味期限</option><option>消費期限</option><option>使用期限</option></select></div><div id="expWrap" class="field hide"><div class="label">期限日</div><input id="exp" type="date"></div><details class="detail"><summary>＋ 詳細を入力</summary><div class="field"><div class="label">購入日</div><input id="purchase" type="date"></div><div class="field"><div class="label">購入価格</div><input id="price" type="number" inputmode="numeric" placeholder="例：1980"></div><div class="field"><div class="label">購入店舗</div><input id="store" placeholder="例：イオン"></div><div class="field"><div class="label">保管場所</div><select id="place"><option>冷蔵庫</option><option>冷凍庫</option><option>パントリー</option><option>洗面所</option><option>トイレ</option><option>収納</option><option>防災収納</option><option>その他</option></select></div><div class="field"><div class="label">メモ</div><textarea id="memo" rows="2"></textarea></div></details><button class="btn" style="width:100%;margin-top:12px" onclick="addItem()">登録する</button></section><section id="buy" class="page"><div class="section">買い物リスト</div><div class="row"><div class="grow"><input id="buyName" style="width:100%;border:0;font-size:16px" placeholder="買うものを入力"></div><button class="btn" onclick="addBuy()">追加</button></div><div id="buyList"></div></section><section id="premium" class="page"><div class="section">Premiumを試す</div><div class="row premium" onclick="premium('receipt')"><div class="grow"><div class="name">🧾 レシート一括補充</div><div class="meta">レシートからまとめて在庫へ</div></div>›</div><div class="row premium" onclick="premium('predict')"><div class="grow"><div class="name">📈 消費予測</div><div class="meta">そろそろ買い時を提案</div></div>›</div><div class="row premium" onclick="premium('qr')"><div class="grow"><div class="name">▦ 収納QR</div><div class="meta">保管場所ごとの在庫確認</div></div>›</div><div class="row premium" onclick="premium('money')"><div class="grow"><div class="name">💰 節約レポート</div><div class="meta">在庫金額や節約効果を確認</div></div>›</div></section></main><nav class="tabs"><button class="tab on" data-p="home" onclick="go('home')"><b>⌂</b>ホーム</button><button class="tab" data-p="stock" onclick="go('stock')"><b>📦</b>在庫</button><button class="tab" data-p="add" onclick="go('add')"><b>＋</b>追加</button><button class="tab" data-p="buy" onclick="go('buy')"><b>🛒</b>買い物</button><button class="tab" data-p="premium" onclick="go('premium')"><b>✦</b>Premium</button></nav></div><div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="sheet" class="sheet"></div></div><script>const C={"食料品":["牛乳","卵","食パン","米","納豆","豆腐","ヨーグルト","豚肉","鶏肉","牛肉","鮭","玉ねぎ","にんじん","じゃがいも","味噌","醤油","冷凍うどん"],"日用品":["ティッシュ","トイレットペーパー","洗濯洗剤","柔軟剤","ゴミ袋","キッチンペーパー","食器用洗剤"],"衛生・薬":["マスク","絆創膏","消毒液","歯磨き粉","常備薬","生理用品"],"ベビー":["オムツ","おしりふき","ベビーソープ","ミルク","離乳食"],"子ども":["クレヨン","画用紙","のり","園用ティッシュ"],"衣類":["肌着","靴下","パジャマ","靴"],"家電・生活用品":["単3電池","単4電池","電球","充電ケーブル","フィルター","カセットボンベ"],"防災":["水","非常食","簡易トイレ","懐中電灯","乾電池"]};const U=n=>/豚肉|鶏肉|牛肉|鮭|肉|魚/.test(n)?"g":/米/.test(n)?"kg":/牛乳|水|醤油|洗剤|柔軟剤|ソープ/.test(n)?"本":/オムツ/.test(n)?"袋":/おしりふき/.test(n)?"パック":/ティッシュ/.test(n)?"箱":/卵/.test(n)?"個":"個";let items=[{id:1,name:"牛乳",cat:"食料品",qty:1,unit:"本",place:"冷蔵庫",expType:"消費期限",exp:plus(2),purchase:today(),price:218,usage:7},{id:2,name:"オムツ",cat:"ベビー",qty:2,unit:"袋",place:"収納",usage:8},{id:3,name:"卵",cat:"食料品",qty:6,unit:"個",place:"冷蔵庫",expType:"賞味期限",exp:plus(5),usage:6}],buys=[];try{let s=JSON.parse(localStorage.getItem("atokoreTrial")||"null");if(s){items=s.items||items;buys=s.buys||[]}}catch(e){}function today(){return new Date().toISOString().slice(0,10)}function plus(d){let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}function save(){try{localStorage.setItem("atokoreTrial",JSON.stringify({items,buys}))}catch(e){}}function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(p).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===p));render()}function days(s){if(!s)return 999;return Math.ceil((new Date(s+'T23:59:59')-new Date())/86400000)}function render(){renderHome();renderStock();renderBuy()}function renderHome(){let exp=items.filter(x=>days(x.exp)<=3),pred=items.filter(x=>(x.usage||0)/(x.qty+1)>1.2).slice(0,3);mExp.textContent=exp.length;mBuy.textContent=buys.length;mPred.textContent=pred.length;hero.className='hero'+(exp.length?' warn':'');heroTitle.textContent=exp.length?`期限が近いものが${exp.length}件`:(buys.length?`買うものが${buys.length}件`:'今日は急ぎなし');heroText.textContent=exp.length?'先に使うものを確認してみて。':buys.length?'買い物リストを確認してみて。':'ストックは落ち着いています。';urgentSec.style.display=exp.length?'block':'none';urgent.innerHTML=exp.map(x=>`<div class="row"><div class="grow"><div class="name">${x.name}</div><div class="meta">${x.expType||'期限'} ${x.exp}・残り${Math.max(0,days(x.exp))}日</div></div><button class="btn ghost" onclick="edit(${x.id})">見る</button></div>`).join('');predHome.innerHTML=pred.length?pred.map(x=>`<div class="row premium"><div class="grow"><div class="name">${x.name}</div><div class="meta">在庫 ${x.qty}${x.unit}・利用頻度高め</div></div><button class="btn" onclick="pushBuy(${x.id})">買う</button></div>`).join(''):'<div class="empty">まだ予測データが少ないです。使うほど提案が育ちます。</div>'}let filter='すべて';function renderStock(){let q=(search?.value||'').trim(),a=items.filter(x=>(filter==='すべて'||x.cat===filter)&&(!q||x.name.includes(q)));let cats=['すべて',...new Set(items.map(x=>x.cat))];catChips.innerHTML=cats.map(c=>`<button class="chip ${c===filter?'on':''}" onclick="filter='${c}';renderStock()">${c}</button>`).join('');stockList.innerHTML=a.length?a.map(x=>`<div class="row" onclick="edit(${x.id})"><div class="grow"><div class="name">${x.name}</div><div class="meta">${x.cat}・${x.place||'場所未設定'}${x.exp?'・'+x.expType+' '+x.exp:''}</div></div><div class="qty" onclick="event.stopPropagation()"><button class="icon" onclick="adj(${x.id},-1)">−</button><b>${x.qty}${x.unit}</b><button class="icon" onclick="adj(${x.id},1)">＋</button></div></div>`).join(''):'<div class="empty">該当する在庫はありません</div>'}function adj(id,d){let x=items.find(v=>v.id===id);x.qty=Math.max(0,(+x.qty||0)+d);x.usage=(x.usage||0)+(d<0?1:0);save();render()}function renderProducts(){let cat=document.getElementById('cat').value,q=document.getElementById('name').value.trim();let a=(C[cat]||[]).filter(x=>!q||x.includes(q));products.innerHTML=a.slice(0,20).map(n=>`<button class="product" onclick="pick('${n}')">${n}<div class="muted">単位 ${U(n)}</div></button>`).join('')}function pick(n){name.value=n;unit.value=U(n);chosen.className='chosen';chosen.innerHTML=`<b>${n}</b><button class="textbtn" onclick="clearPick()">×</button>`;num.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{num.focus();num.select()},220)}function clearPick(){name.value='';chosen.className='hide';renderProducts()}function autoUnit(){if(name.value.trim())unit.value=U(name.value.trim())}function toggleExp(){expWrap.classList.toggle('hide',expType.value==='期限なし')}function addItem(){let n=name.value.trim();if(!n)return alert('商品名を入力してください');let obj={id:Date.now(),name:n,cat:cat.value,qty:+num.value||1,unit:unit.value,expType:expType.value,exp:expType.value==='期限なし'?'':exp.value,purchase:purchase.value,price:+price.value||0,store:store.value.trim(),place:place.value,memo:memo.value.trim(),usage:1};items.push(obj);save();name.value='';num.value=1;expType.value='期限なし';toggleExp();clearPick();alert('登録しました');go('stock')}function pushBuy(id){let x=items.find(v=>v.id===id);let b=buys.find(v=>v.name===x.name);if(b)b.qty++;else buys.push({id:Date.now(),name:x.name,qty:1,unit:x.unit,stockId:x.id});save();render();alert('買い物リストに追加しました')}function addBuy(){let n=buyName.value.trim();if(!n)return;let b=buys.find(v=>v.name===n);if(b)b.qty++;else buys.push({id:Date.now(),name:n,qty:1,unit:U(n)});buyName.value='';save();renderBuy()}function renderBuy(){buyList.innerHTML=buys.length?buys.map(b=>`<div class="row"><input type="checkbox" class="bc" value="${b.id}"><div class="grow"><div class="name">${b.name}</div></div><div class="qty"><button class="icon" onclick="badj(${b.id},-1)">−</button><b>${b.qty}${b.unit}</b><button class="icon" onclick="badj(${b.id},1)">＋</button></div><button class="icon danger" onclick="bdel(${b.id})">×</button></div>`).join('')+`<button class="btn" style="width:100%;margin-top:10px" onclick="bought()">選択した商品を購入済みにする</button>`:'<div class="empty">買うものはありません</div>'}function badj(id,d){let b=buys.find(v=>v.id===id);b.qty=Math.max(1,b.qty+d);save();renderBuy()}function bdel(id){buys=buys.filter(v=>v.id!==id);save();renderBuy()}function bought(){let ids=[...document.querySelectorAll('.bc:checked')].map(x=>+x.value);if(!ids.length)return alert('商品を選んでください');ids.forEach(id=>{let b=buys.find(v=>v.id===id),x=items.find(v=>v.name===b.name);if(x){x.qty+=b.qty;x.usage=(x.usage||0)+1}else items.push({id:Date.now()+id,name:b.name,cat:'その他',qty:b.qty,unit:b.unit,usage:1})});buys=buys.filter(v=>!ids.includes(v.id));save();render();alert('在庫へ反映しました')}function edit(id){let x=items.find(v=>v.id===id);open(`<button class="close" onclick="closeM()">閉じる</button><h2>${x.name}</h2><div class="meta">${x.cat}・${x.place||'未設定'}</div><div class="row"><div class="grow">現在数</div><div class="qty"><button class="icon" onclick="adj(${x.id},-1);edit(${x.id})">−</button><b>${x.qty}${x.unit}</b><button class="icon" onclick="adj(${x.id},1);edit(${x.id})">＋</button></div></div>${x.exp?`<div class="row"><div class="grow"><b>${x.expType}</b><div class="meta">${x.exp}</div></div></div>`:''}<button class="btn" style="width:100%" onclick="pushBuy(${x.id});closeM()">🛒 買い物リストに追加</button><button class="btn danger" style="width:100%;margin-top:8px" onclick="del(${x.id})">この商品を削除</button>`)}function del(id){if(confirm('この商品を削除しますか？')){items=items.filter(v=>v.id!==id);save();closeM();render()}}function open(h){sheet.innerHTML=h;modal.classList.add('on')}function closeM(){modal.classList.remove('on')}function premium(k){if(k==='receipt')open(`<button class="close" onclick="closeM()">閉じる</button><h2>🧾 レシート一括補充</h2><p class="muted">試用版ではデモ解析できます。</p><button class="btn" style="width:100%" onclick="receiptDemo()">デモ解析する</button><div id="demo"></div>`);if(k==='predict'){let a=[...items].sort((a,b)=>(b.usage||0)/(b.qty+1)-(a.usage||0)/(a.qty+1)).slice(0,6);open(`<button class="close" onclick="closeM()">閉じる</button><h2>📈 消費予測</h2>${a.map(x=>`<div class="row"><div class="grow"><div class="name">${x.name}</div><div class="meta">在庫 ${x.qty}${x.unit}・そろそろ度 ${Math.min(99,Math.round((x.usage||1)/(x.qty+1)*20))}%</div></div><button class="btn" onclick="pushBuy(${x.id})">買う</button></div>`).join('')}`)}if(k==='qr'){let ps=[...new Set(items.map(x=>x.place||'未設定'))];open(`<button class="close" onclick="closeM()">閉じる</button><h2>▦ 収納QR</h2>${ps.map(p=>`<div class="row"><div class="grow"><div class="name">${p}</div><div class="meta">${items.filter(x=>(x.place||'未設定')===p).map(x=>x.name+' '+x.qty+x.unit).join(' / ')||'登録なし'}</div></div></div>`).join('')}`)}if(k==='money'){let v=items.reduce((s,x)=>s+(x.price||0)*Math.max(1,x.qty||1),0),p=items.filter(x=>x.price>0).length;open(`<button class="close" onclick="closeM()">閉じる</button><h2>💰 節約レポート</h2><div class="metrics"><div class="metric"><b>¥${v.toLocaleString()}</b><span class="muted">推定在庫金額</span></div><div class="metric"><b>${p}</b><span class="muted">価格記録</span></div><div class="metric"><b>¥${(p*420).toLocaleString()}</b><span class="muted">推定節約</span></div></div>`)} }function receiptDemo(){demo.innerHTML=`<div class="section">解析結果</div><div class="row"><div class="grow"><b>牛乳 2本</b><div class="meta">¥458</div></div></div><div class="row"><div class="grow"><b>卵 1パック</b><div class="meta">¥298</div></div></div><button class="btn" style="width:100%" onclick="applyReceipt()">在庫へ反映</button>`}function applyReceipt(){let x=items.find(v=>v.name==='牛乳');x?x.qty+=2:items.push({id:Date.now(),name:'牛乳',cat:'食料品',qty:2,unit:'本',place:'冷蔵庫',usage:1});save();render();demo.innerHTML='<div class="empty">在庫へ反映しました</div>'}purchase.value=today();renderProducts();render();</script></body></html>
