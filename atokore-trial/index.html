<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あとこれ 試用版 v3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#172033}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:86px}.top{position:sticky;top:0;z-index:9;background:#fff;padding:14px 16px;border-bottom:1px solid #eee}.top h1{margin:0;font-size:21px}.sub,.meta,.muted{font-size:12px;color:#667085}.content{padding:14px}.page{display:none}.page.on{display:block}.hero{padding:18px;border-radius:20px;background:#eef6ff;border:1px solid #dceaff}.hero.warn{background:#fff7e8;border-color:#f5d28a}.hero h2{font-size:24px;margin:4px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric,.quick button,.product,.chip,.btn,.icon{border:0;font:inherit}.metric{padding:10px;border:1px solid #e5e7eb;border-radius:15px;background:#fff;text-align:center}.metric b{display:block;font-size:21px}.section{font-weight:900;margin:18px 0 9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{padding:12px 6px;border:1px solid #e5e7eb;border-radius:15px;background:#fff;font-weight:800}.quick strong{display:block;font-size:22px}.row{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:15px;padding:11px;margin:8px 0;background:#fff}.selectedRow{border-color:#1677ff;background:#f4f8ff}.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bulkbar .btn{flex:1;min-width:120px}.grow{flex:1;min-width:0}.name{font-weight:850}.qty{display:flex;align-items:center;gap:6px}.qty b{min-width:46px;text-align:center}.icon{width:38px;height:38px;border-radius:11px;background:#eef2f7;font-size:19px}.btn{background:#1677ff;color:#fff;padding:11px 13px;border-radius:12px;font-weight:850}.ghost{background:#eef2f7;color:#25324a}.danger{background:#fff0f0;color:#b42318}.field{margin:11px 0}.label{font-size:13px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:12px;font-size:16px;background:#fff}.chips{display:flex;gap:7px;overflow:auto;margin:8px 0}.chip{white-space:nowrap;padding:8px 11px;border:1px solid #dfe4ea;border-radius:999px;background:#fff}.chip.on{background:#1677ff;color:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:7px}.product{text-align:left;padding:10px;border:1px solid #dfe4ea;border-radius:11px;background:#fff}.hide{display:none}.detail{border:1px solid #e5e7eb;border-radius:14px;padding:10px;background:#fbfcfe}.detail summary{font-weight:850}.premium{background:linear-gradient(135deg,#faf7ff,#eef5ff);border-color:#d9ceff}.empty{padding:14px;border:1px dashed #d6dbe3;border-radius:14px;text-align:center;color:#667085;font-size:13px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:20}.tab{border:0;background:none;padding:6px 2px;color:#667085;font-size:11px}.tab b{display:block;font-size:20px}.tab.on{color:#1677ff}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{width:min(480px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 26px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#efe7ff;color:#6f42c1;font-weight:850}.close{float:right;border:0;background:#eef2f7;border-radius:10px;padding:7px 10px}
</style></head><body><div class="app"><header class="top"><h1>あとこれ <span class="badge">試用版 v3</span></h1><div class="sub">家庭のストックを、できるだけ簡単に</div></header><main class="content">
<section id="pg-home" class="page on"><div id="homeHero" class="hero"><div class="muted">今日のあとこれ</div><h2 id="heroTitle">今日は急ぎなし</h2><div id="heroText" class="muted"></div></div><div class="metrics"><button class="metric" onclick="go('stock')">⏰<b id="mExp">0</b><span class="muted">期限近い</span></button><button class="metric" onclick="go('buy')">🛒<b id="mBuy">0</b><span class="muted">買うもの</span></button><button class="metric" onclick="showPremium('predict')">✦<b id="mPred">0</b><span class="muted">そろそろ</span></button></div><div class="section">すぐやる</div><div class="quick"><button onclick="go('add')"><strong>＋</strong>ストック追加</button><button onclick="go('buy')"><strong>🛒</strong>買い物メモ</button><button onclick="showPremium('receipt')"><strong>🧾</strong>レシート補充</button></div><div id="urgentWrap"><div class="section">今日優先</div><div id="urgentList"></div></div></section>
<section id="pg-stock" class="page"><div class="field"><input id="stockSearch" placeholder="品名を検索" oninput="renderStock()"></div><div class="row"><div class="grow"><div class="name">在庫からまとめて買い物へ</div><div class="meta">複数の商品を選んで一括追加できます</div></div><button id="stockSelectToggle" class="btn ghost" onclick="toggleStockSelect()">まとめて選ぶ</button></div><div id="stockBulkActions" class="bulkbar hide"><button class="btn ghost" onclick="selectAllVisible()">表示中を全選択</button><button id="stockBulkMove" class="btn" onclick="moveSelectedToBuy()">選択した0件を買い物へ</button><button class="btn ghost" onclick="clearBulkSelection()">選択解除</button></div><div id="catChips" class="chips"></div><div id="stockList"></div></section>
<section id="pg-add" class="page"><div class="section">商品を追加</div><div class="field"><div class="label">カテゴリー</div><select id="addCat" onchange="renderCatalog()"><option>食料品</option><option>日用品</option><option>衛生・薬</option><option>ベビー</option><option>子ども</option><option>衣類</option><option>家電・生活用品</option><option>防災</option></select></div><div class="field"><div class="label">商品検索 / 手動入力</div><input id="addName" placeholder="例：牛乳、オムツ" oninput="onNameInput()"></div><div id="catalog" class="products"></div><div class="field"><div class="label">個数・数量</div><input id="addQty" type="number" min="0" step="1" value="1"></div><div class="field"><div class="label">単位</div><select id="addUnit"><option>個</option><option>本</option><option>袋</option><option>箱</option><option>パック</option><option>枚</option><option>g</option><option>kg</option><option>ml</option><option>L</option></select><div class="muted">商品に合わせて自動選択。肉・魚はg / kgへ変更できます。</div></div><div class="field"><div class="label">期限の種類</div><select id="addExpType" onchange="toggleExp()"><option>期限なし</option><option>賞味期限</option><option>消費期限</option><option>使用期限</option></select></div><div id="addExpWrap" class="field hide"><div class="label">期限日</div><input id="addExp" type="date"></div><details class="detail"><summary>＋ 詳細を入力</summary><div class="field"><div class="label">購入日</div><input id="addPurchase" type="date"></div><div class="field"><div class="label">購入価格</div><input id="addPrice" type="number" placeholder="例：398"></div><div class="field"><div class="label">購入店舗</div><input id="addStore" placeholder="例：イオン"></div><div class="field"><div class="label">保管場所</div><select id="addPlace"><option>冷蔵庫</option><option>冷凍庫</option><option>パントリー</option><option>洗面所</option><option>トイレ</option><option>収納</option><option>防災収納</option><option>その他</option></select></div><div class="field"><div class="label">メモ</div><textarea id="addMemo" rows="2"></textarea></div></details><button class="btn" style="width:100%;margin-top:12px" onclick="registerItem()">この内容で登録</button></section>
<section id="pg-buy" class="page"><div class="section">買い物リスト</div><div class="row"><div class="grow"><input id="buyName" style="width:100%;border:0;font-size:16px" placeholder="買うものを入力"></div><button class="btn" onclick="addBuy()">追加</button></div><div id="buyList"></div></section>
<section id="pg-premium" class="page"><div class="section">Premiumを試す</div><div class="row premium" onclick="showPremium('receipt')"><div class="grow"><div class="name">🧾 レシート一括補充</div><div class="meta">デモ解析→在庫反映</div></div>›</div><div class="row premium" onclick="showPremium('predict')"><div class="grow"><div class="name">📈 消費予測</div><div class="meta">そろそろ買い時を提案</div></div>›</div><div class="row premium" onclick="showPremium('qr')"><div class="grow"><div class="name">▦ 収納QR</div><div class="meta">保管場所ごとの在庫確認</div></div>›</div><div class="row premium" onclick="showPremium('money')"><div class="grow"><div class="name">💰 節約レポート</div><div class="meta">在庫金額や節約効果</div></div>›</div></section>
</main><nav class="tabs"><button class="tab on" data-p="home" onclick="go('home')"><b>⌂</b>ホーム</button><button class="tab" data-p="stock" onclick="go('stock')"><b>📦</b>在庫</button><button class="tab" data-p="add" onclick="go('add')"><b>＋</b>追加</button><button class="tab" data-p="buy" onclick="go('buy')"><b>🛒</b>買い物</button><button class="tab" data-p="premium" onclick="go('premium')"><b>✦</b>Premium</button></nav></div><div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="sheet" class="sheet"></div></div>
<script>
const $=id=>document.getElementById(id); const C={"食料品":["牛乳","卵","食パン","米","納豆","豆腐","ヨーグルト","豚肉","鶏肉","牛肉","鮭","玉ねぎ","にんじん","じゃがいも","味噌","醤油","冷凍うどん"],"日用品":["ティッシュ","トイレットペーパー","洗濯洗剤","柔軟剤","ゴミ袋","キッチンペーパー","食器用洗剤"],"衛生・薬":["マスク","絆創膏","消毒液","歯磨き粉","常備薬","生理用品"],"ベビー":["オムツ","おしりふき","ベビーソープ","ミルク","離乳食"],"子ども":["クレヨン","画用紙","のり","園用ティッシュ"],"衣類":["肌着","靴下","パジャマ","靴"],"家電・生活用品":["単3電池","単4電池","電球","充電ケーブル","フィルター","カセットボンベ"],"防災":["水","非常食","簡易トイレ","懐中電灯","乾電池"]};
const unitOf=n=>/豚肉|鶏肉|牛肉|鮭|肉|魚/.test(n)?"g":/米$|お米/.test(n)?"kg":/牛乳|水|醤油|洗剤|柔軟剤|ソープ|ミルク/.test(n)?"本":/オムツ|ゴミ袋/.test(n)?"袋":/おしりふき/.test(n)?"パック":/ティッシュ/.test(n)?"箱":/卵/.test(n)?"個":"個";
const today=()=>new Date().toISOString().slice(0,10); const plus=d=>{let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}; const days=s=>!s?999:Math.ceil((new Date(s+'T23:59:59')-new Date())/86400000);
let items=[{id:1,name:"牛乳",cat:"食料品",qty:1,unit:"本",place:"冷蔵庫",expType:"消費期限",exp:plus(2),price:218,usage:7},{id:2,name:"オムツ",cat:"ベビー",qty:2,unit:"袋",place:"収納",usage:8},{id:3,name:"卵",cat:"食料品",qty:6,unit:"個",place:"冷蔵庫",expType:"賞味期限",exp:plus(5),usage:6}],buys=[]; try{const s=JSON.parse(localStorage.getItem('atokoreTrialV2')||'null');if(s){items=s.items||items;buys=s.buys||[]}}catch(e){}
function save(){try{localStorage.setItem('atokoreTrialV2',JSON.stringify({items,buys}))}catch(e){}} function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$('pg-'+p).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===p));render();if(p==='add')renderCatalog()} function render(){renderHome();renderStock();renderBuy()}
function renderHome(){const near=items.filter(x=>x.exp&&days(x.exp)<=3),pred=items.filter(x=>(x.usage||0)/(x.qty+1)>1.2);$('mExp').textContent=near.length;$('mBuy').textContent=buys.length;$('mPred').textContent=pred.length;$('homeHero').className='hero'+(near.length?' warn':'');$('heroTitle').textContent=near.length?`期限が近いものが${near.length}件`:buys.length?`買うものが${buys.length}件`:'今日は急ぎなし';$('heroText').textContent=near.length?'先に使うものを確認してみて。':buys.length?'買い物リストを確認してみて。':'ストックは落ち着いています。';$('urgentWrap').style.display=near.length?'block':'none';$('urgentList').innerHTML=near.map(x=>`<div class="row"><div class="grow"><div class="name">${x.name}</div><div class="meta">${x.expType} ${x.exp}</div></div></div>`).join('')}
let filter='すべて',stockSelectMode=false,stockSelected=new Set(); function visibleStock(){const q=($('stockSearch')?.value||'').trim();return items.filter(x=>(filter==='すべて'||x.cat===filter)&&(!q||x.name.includes(q)))} function renderStock(){const cats=['すべて',...new Set(items.map(x=>x.cat))];$('catChips').innerHTML=cats.map(c=>`<button class="chip ${c===filter?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join('');const arr=visibleStock();$('stockSelectToggle').textContent=stockSelectMode?'選択を終了':'まとめて選ぶ';$('stockBulkActions').classList.toggle('hide',!stockSelectMode);$('stockBulkMove').textContent=`選択した${stockSelected.size}件を買い物へ`;$('stockList').innerHTML=arr.length?arr.map(x=>{const picked=stockSelected.has(x.id);const selectBox=stockSelectMode?`<input type="checkbox" ${picked?'checked':''} onclick="event.stopPropagation();toggleStockPick(${x.id})" style="width:22px;height:22px">`:'';const controls=stockSelectMode?`<div class="qty"><b>${x.qty}${x.unit}</b></div>`:`<div class="qty"><button class="icon" onclick="adj(${x.id},-1)">−</button><b>${x.qty}${x.unit}</b><button class="icon" onclick="adj(${x.id},1)">＋</button></div><button class="icon danger" onclick="delItem(${x.id})">×</button>`;return `<div class="row ${picked?'selectedRow':''}" ${stockSelectMode?`onclick="toggleStockPick(${x.id})"`:''}>${selectBox}<div class="grow"><div class="name">${x.name}</div><div class="meta">${x.cat}・${x.place||'未設定'}${x.exp?'・'+x.expType+' '+x.exp:''}</div></div>${controls}</div>`}).join(''):'<div class="empty">該当なし</div>'} function setFilter(c){filter=c;renderStock()} function toggleStockSelect(){stockSelectMode=!stockSelectMode;stockSelected.clear();renderStock()} function toggleStockPick(id){if(!stockSelectMode)return;stockSelected.has(id)?stockSelected.delete(id):stockSelected.add(id);renderStock()} function selectAllVisible(){visibleStock().forEach(x=>stockSelected.add(x.id));renderStock()} function clearBulkSelection(){stockSelected.clear();renderStock()} function buyStep(unit){return unit==='g'||unit==='ml'?100:1} function moveSelectedToBuy(){if(!stockSelected.size){alert('商品を選んでください');return}let added=0;stockSelected.forEach(id=>{const x=items.find(v=>v.id===id);if(!x)return;const step=buyStep(x.unit);let b=buys.find(v=>v.stockId===x.id||(v.name===x.name&&v.unit===x.unit));if(b)b.qty+=step;else buys.push({id:Date.now()+id,name:x.name,qty:step,unit:x.unit,stockId:x.id});added++});save();stockSelected.clear();stockSelectMode=false;render();alert(`${added}件を買い物リストに追加しました`);go('buy')} function adj(id,d){const x=items.find(v=>v.id===id);if(!x)return;x.qty=Math.max(0,(+x.qty||0)+d);if(d<0)x.usage=(x.usage||0)+1;save();render()}
function renderCatalog(){const cat=$('addCat').value,q=$('addName').value.trim();$('catalog').innerHTML=(C[cat]||[]).filter(n=>!q||n.includes(q)).slice(0,18).map(n=>`<button class="product" onclick="pickItem('${n}')">${n}<div class="muted">単位 ${unitOf(n)}</div></button>`).join('')} function onNameInput(){const n=$('addName').value.trim();if(n)$('addUnit').value=unitOf(n);renderCatalog()} function pickItem(n){$('addName').value=n;$('addUnit').value=unitOf(n);const q=$('addQty');q.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{q.focus();q.select()},200)} function toggleExp(){$('addExpWrap').classList.toggle('hide',$('addExpType').value==='期限なし')}
function registerItem(){const n=$('addName').value.trim();if(!n){alert('商品名を入力してください');return}const qty=Number($('addQty').value);if(!Number.isFinite(qty)||qty<0){alert('数量を確認してください');return}const obj={id:Date.now(),name:n,cat:$('addCat').value,qty:qty,unit:$('addUnit').value,expType:$('addExpType').value,exp:$('addExpType').value==='期限なし'?'':$('addExp').value,purchase:$('addPurchase').value,price:Number($('addPrice').value)||0,store:$('addStore').value.trim(),place:$('addPlace').value,memo:$('addMemo').value.trim(),usage:1};items.push(obj);save();$('addName').value='';$('addQty').value='1';$('addExpType').value='期限なし';$('addExp').value='';toggleExp();renderCatalog();render();alert('登録しました');go('stock')}
function delItem(id){if(!confirm('この商品を削除しますか？'))return;items=items.filter(x=>x.id!==id);save();render()} function addBuy(){const n=$('buyName').value.trim();if(!n)return;const b=buys.find(x=>x.name===n);if(b)b.qty++;else buys.push({id:Date.now(),name:n,qty:1,unit:unitOf(n)});$('buyName').value='';save();renderBuy()} function renderBuy(){$('buyList').innerHTML=buys.length?buys.map(b=>`<div class="row"><input type="checkbox" class="buyCheck" value="${b.id}"><div class="grow"><div class="name">${b.name}</div></div><div class="qty"><button class="icon" onclick="badj(${b.id},-1)">−</button><b>${b.qty}${b.unit}</b><button class="icon" onclick="badj(${b.id},1)">＋</button></div><button class="icon danger" onclick="bdel(${b.id})">×</button></div>`).join('')+`<button class="btn" style="width:100%;margin-top:10px" onclick="bought()">選択した商品を購入済みにする</button>`:'<div class="empty">買うものはありません</div>'} function badj(id,d){const b=buys.find(x=>x.id===id);if(!b)return;const step=buyStep(b.unit);b.qty=Math.max(step,b.qty+d*step);save();renderBuy()} function bdel(id){buys=buys.filter(x=>x.id!==id);save();renderBuy()} function bought(){const ids=[...document.querySelectorAll('.buyCheck:checked')].map(x=>Number(x.value));if(!ids.length){alert('商品を選んでください');return}ids.forEach(id=>{const b=buys.find(x=>x.id===id);if(!b)return;let x=items.find(v=>v.name===b.name&&v.unit===b.unit);if(x)x.qty+=b.qty;else items.push({id:Date.now()+id,name:b.name,cat:'その他',qty:b.qty,unit:b.unit,usage:1})});buys=buys.filter(x=>!ids.includes(x.id));save();render();alert('在庫へ反映しました')}
function openM(html){$('sheet').innerHTML=html;$('modal').classList.add('on')} function closeM(){$('modal').classList.remove('on')} function showPremium(k){if(k==='receipt')openM(`<button class="close" onclick="closeM()">閉じる</button><h2>🧾 レシート一括補充</h2><p class="muted">試用版はデモ解析です。</p><button class="btn" style="width:100%" onclick="applyReceipt()">牛乳2本・卵1パックを反映</button>`);if(k==='predict'){const a=[...items].sort((a,b)=>(b.usage||0)/(b.qty+1)-(a.usage||0)/(a.qty+1)).slice(0,6);openM(`<button class="close" onclick="closeM()">閉じる</button><h2>📈 消費予測</h2>${a.map(x=>`<div class="row"><div class="grow"><div class="name">${x.name}</div><div class="meta">そろそろ度 ${Math.min(99,Math.round((x.usage||1)/(x.qty+1)*20))}%</div></div><button class="btn" onclick="premiumBuy(${x.id})">買う</button></div>`).join('')}`)}if(k==='qr'){const ps=[...new Set(items.map(x=>x.place||'未設定'))];openM(`<button class="close" onclick="closeM()">閉じる</button><h2>▦ 収納QR</h2>${ps.map(p=>`<div class="row"><div class="grow"><div class="name">${p}</div><div class="meta">${items.filter(x=>(x.place||'未設定')===p).map(x=>x.name+' '+x.qty+x.unit).join(' / ')||'登録なし'}</div></div></div>`).join('')}`)}if(k==='money'){const v=items.reduce((s,x)=>s+(x.price||0)*Math.max(1,x.qty||1),0);openM(`<button class="close" onclick="closeM()">閉じる</button><h2>💰 節約レポート</h2><div class="metrics"><div class="metric"><b>¥${v.toLocaleString()}</b><span class="muted">推定在庫金額</span></div><div class="metric"><b>${items.filter(x=>x.price>0).length}</b><span class="muted">価格記録</span></div><div class="metric"><b>${items.length}</b><span class="muted">登録品</span></div></div>`)}} function premiumBuy(id){const x=items.find(v=>v.id===id);if(!x)return;const b=buys.find(v=>v.name===x.name);if(b)b.qty++;else buys.push({id:Date.now(),name:x.name,qty:1,unit:x.unit});save();render();alert('買い物リストに追加しました')} function applyReceipt(){let x=items.find(v=>v.name==='牛乳');if(x)x.qty+=2;else items.push({id:Date.now(),name:'牛乳',cat:'食料品',qty:2,unit:'本',place:'冷蔵庫',usage:1});let e=items.find(v=>v.name==='卵');if(e)e.qty+=1;else items.push({id:Date.now()+1,name:'卵',cat:'食料品',qty:1,unit:'パック',place:'冷蔵庫',usage:1});save();render();closeM();alert('レシート内容を在庫へ反映しました')}
$('addPurchase').value=today();renderCatalog();render();
</script></body></html>
