name: Atokore Safe iPhone Review Build (No Deployment)

on:
  pull_request:
    paths:
      - scripts/atokore/build-local-review.py
      - docs/atokore-local-iphone-review.md
      - .github/workflows/atokore-safe-review-build.yml

permissions:
  contents: read

jobs:
  local-only-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build only, without web deployment, DB or credentials
        run: |
          python3 -I scripts/atokore/build-local-review.py atokore-live-v125 _local_review 19
      - name: Fail if any active family-sharing config or standard storage keys remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('_local_review')
          config=(root/'household-config-v37.js').read_text()
          html=(root/'index.html').read_text()
          family=(root/'family.js').read_text()
          js=(root/'household-sync-v37.js').read_text()
          assert config.strip().endswith('window.ATOKORE_HOUSEHOLD_CONFIG = null;')
          assert 'ベビー特化 ローカル確認用 v19・家族共有無効' in html
          assert 'family sync is intentionally disabled' in family
          assert 'const cfg=root.ATOKORE_HOUSEHOLD_CONFIG;' in js
          assert 'atokorePreviewTrialV19' in html
          assert not re.search(r'\batokoreTrialV4\b', html)
          assert not (root/'index.html').is_symlink()
          for file in root.glob('*.js'):
            content=file.read_text()
            assert 'vzyxurodowpjltwbgbyc.supabase.co' not in content, file.name
          print('local-only configuration checks passed; no deployment attempted')
          PY
      - name: JavaScript syntax in generated review build
        run: |
          find _local_review -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
      # Artifact only: stores static assets for the owner's separate-origin manual test.
      # Not a website, not a deployment, and never a source of credentials.
      - name: Package isolated trial for owner-only iPhone deployment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 106 }}
        uses: actions/upload-artifact@v4
        with:
          name: atokore-v50-local-only-review
          path: _local_review/
          if-no-files-found: error
          retention-days: 3
