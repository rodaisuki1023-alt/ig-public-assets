name: Atokore v19 Trial Checks

on:
  push:
    branches: ['claude/atokore-v19-p0-source', 'codex/atokore-polish-v44', 'codex/atokore-muse-v45', 'codex/atokore-followup-v46']
  pull_request:
    paths:
      - 'atokore-live-v125/**'
      - 'scripts/atokore/**'
      - 'supabase/**'
      - 'tests/**'
      - 'proposals/**'
      - 'atokore-tools-v51/**'
      - 'docs/atokore-v51-*.md'
      - '.github/workflows/atokore-v19-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-prep-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/atokore-family-prep-v51.test.cjs
  photo-focused-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --ignore-scripts jsdom@26.1.0 @playwright/test@1.56.1 @electric-sql/pglite@0.5.8
      - name: Focused photo sharing regression in both browsers
        run: npx playwright test -c tests/e2e-v19/playwright.config.cjs w2-backup-share.spec.cjs --grep 'photos are shared automatically' --repeat-each=2 --trace retain-on-failure
      - name: Upload the trace of a failed focused photo run (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atokore-photo-focused-trace
          path: |
            test-results
            tests/e2e-v19/test-results
          if-no-files-found: ignore
          retention-days: 7
  photo-edge-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Verify frozen and audited Edge dependencies
        run: |
          lock="supabase/proposals/photo-general-v50.deno.lock"
          test -s "$lock"
          deno --version
          deno cache --lock="$lock" --frozen supabase/proposals/photo-general-edge-v50.ts
          deno check --lock="$lock" --frozen supabase/proposals/photo-general-edge-v50.ts
          deno audit --lock="$lock" --frozen
          git diff --exit-code -- "$lock"
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atokore_ci
          POSTGRES_PASSWORD: atokore-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts pg@8.16.3
      - name: Real PostgreSQL lock and revocation races
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/revocation-postgres.cjs
      - name: Real PostgreSQL household photo limit race (free 5)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/photo-plan-limit-postgres.cjs
      - name: Real PostgreSQL simultaneous family purchases (estimate 240, undo 180)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/purchase-merge-postgres.cjs
      - name: Real PostgreSQL legacy photo close under concurrent writes (draft)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/photo-legacy-close-postgres.cjs
      - name: Real PostgreSQL Work 6th fixes (photo generation, notice reservations, undo window on every entry)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/safety3-postgres.cjs
      - name: Real PostgreSQL Work 7th fixes (notice fence vs leaving, delete fence, undo with estimate in one transaction)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/safety4-postgres.cjs
      - name: Real PostgreSQL Work 8th fixes (stalled sender bounded, forecast owned by the purchase)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/safety5-postgres.cjs
      - name: Real PostgreSQL Work 9th fixes (capacity reservations serialized, undo at 599/600 s, strict receipt input)
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/safety6-postgres.cjs
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Same Playwright/browser versions as the npm package, with dependencies preinstalled.
      # The image digest is pinned so an upstream tag update cannot change the release gate.
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          npm install --no-save --ignore-scripts jsdom@26.1.0 @playwright/test@1.56.1 @electric-sql/pglite@0.5.8 jpeg-js@0.4.4
      - name: Text size across app screens
        run: npx playwright test -c tests/e2e-v19/playwright.config.cjs polish-v44.spec.cjs --grep 'text size changes'
      - name: Baby food age order in both views
        run: npx playwright test -c tests/e2e-v19/playwright.config.cjs w2-month-search.spec.cjs --grep 'baby food is ordered'
      - name: Syntax and unit regressions
        run: |
          for f in atokore-live-v125/*.js; do node --check "$f"; done
          python3 -I scripts/atokore/build-preview.py atokore-live-v125 "$RUNNER_TEMP/v19-build" 19
          node tests/atokore-core.test.cjs
          node --test tests/atokore-product-identity.test.cjs
          node --test tests/atokore-product-photos-v30.test.cjs
          node --test tests/atokore-photo-gateway-policy.test.cjs tests/atokore-photo-gateway-read-adapter.test.cjs
          node --test tests/atokore-photo-gateway-operations.test.cjs tests/atokore-photo-gateway-browser.test.cjs
          node --test tests/atokore-photo-gateway-sql.test.cjs
          node --test tests/atokore-photo-gateway-trial-guard.test.cjs
          node --test tests/atokore-photo-reservation-v50.test.cjs
          node --test tests/atokore-photo-lifecycle-v50.test.cjs
          node --test tests/atokore-photo-general-v50.test.cjs tests/atokore-photo-general-http-v50.test.cjs tests/atokore-photo-general-client-v50.test.cjs tests/atokore-photo-budget-v50.test.cjs tests/atokore-photo-general-trial-scope-v50.test.cjs tests/atokore-photo-migration-rehearsal-v50.test.cjs
          node --check supabase/functions/_shared/photo-gateway-handler.mjs
          node --test tests/atokore-auth-qa-guard.test.cjs
          node --test tests/atokore-photo-gateway-qa-guard.test.cjs
          python3 -I scripts/atokore/photo-gateway-http-qa.py --self-test
          python3 -I scripts/atokore/photo-general-http-qa-v50.py --self-test
          mkdir -p "$RUNNER_TEMP/photo-qa-build/_local_review"
          printf '%s\n' '<!doctype html><title>isolated QA fixture</title>' > "$RUNNER_TEMP/photo-qa-build/_local_review/index.html"
          python3 -I scripts/atokore/attach-photo-gateway-qa.py "$RUNNER_TEMP/photo-qa-build/_local_review"
          cmp tests/manual/atokore-v50-photo-gateway-qa.html "$RUNNER_TEMP/photo-qa-build/_local_review/qa/atokore-v50-photo-gateway-qa.html"
          node --test tests/atokore-baby-food-v35.test.cjs
          node --test tests/atokore-batch-review-v36.test.cjs
          node --test --test-concurrency=1 tests/atokore-household-core.test.cjs tests/atokore-household-sync.test.cjs tests/atokore-household-sql.test.cjs tests/atokore-entitlements-sql.test.cjs tests/atokore-history-w2-sql.test.cjs tests/atokore-receipt-imports-sql.test.cjs tests/atokore-household-guest-v42.test.cjs
          node --test tests/atokore-household-google-v40.test.cjs
          node --test tests/atokore-home-v43.test.cjs tests/atokore-polish-v44.test.cjs tests/atokore-muse-v45.test.cjs
          node tests/atokore-actions.integration.test.cjs
          node tests/atokore-receipt-input.test.cjs
          node tests/atokore-receipt-product-names.test.cjs
          node --test tests/atokore-receipt-match-v38.test.cjs
          node --test tests/atokore-receipt-structure-v49.test.cjs
          node --test tests/atokore-receipt-eval-smoke.test.cjs
          node --test tests/atokore-receipt-family-queue.test.cjs
          node tests/atokore-pwa.test.cjs
          node --test tests/atokore-routine-catalog-v20.test.cjs
          node --test tests/atokore-routine-stock-one-tap.test.cjs
          node --test tests/atokore-backup-ids.test.cjs
          node --test tests/atokore-no-native-confirm.test.cjs
          node --test tests/atokore-food-month-display.test.cjs
          node --test tests/atokore-search-v48.test.cjs
          node --test tests/atokore-stock-rules-v48.test.cjs
          node --test tests/atokore-stock-levels-v51.test.cjs tests/atokore-tools-v51.test.cjs tests/atokore-units-v51.test.cjs
          node --test tests/atokore-prep-sets-v51.test.cjs tests/atokore-entitlements-v51.test.cjs tests/atokore-notify-policy-v51.test.cjs tests/atokore-usage-monitor-v51.test.cjs
          node --test --test-concurrency=1 tests/atokore-buy-assignment-v51.test.cjs tests/atokore-prep-share-v51.test.cjs tests/atokore-photo-legacy-closure-v51.test.cjs
          # v51 SQL drafts and their Work 6th regressions (photo move/close, notices, undo window, per-unit rollback)
          node --test --test-concurrency=1 tests/atokore-photo-legacy-migrate-v51.test.cjs tests/atokore-photo-regressions-v51.test.cjs \
            tests/atokore-notify-claim-v51.test.cjs tests/atokore-purchase-undo-window-v51.test.cjs tests/atokore-undo-window-guard-v51.test.cjs \
            tests/atokore-sql-units-rollback-v51.test.cjs tests/atokore-safe-trial-build.test.cjs tests/atokore-photo-delete-paths-v51.test.cjs tests/atokore-purchase-op-forecast-v51.test.cjs
          node --test tests/atokore-buy-duplicates-v48.test.cjs
          node --test tests/atokore-baby-food-search-v48.test.cjs
          node --test tests/atokore-quick-add.test.cjs tests/atokore-peach-ui.test.cjs tests/atokore-baby-visuals.test.cjs \
            tests/atokore-mobile-dom.test.cjs tests/atokore-distinct-icons.test.cjs tests/atokore-edit-after-add.test.cjs \
            tests/atokore-baby-focus-v17.test.cjs tests/atokore-add-clarity-v18.test.cjs \
            tests/atokore-storage-bootstrap-v19.test.cjs
      - name: Real-browser tests (Chromium + WebKit)
        env:
          E2E_SCREEN_DIR: ${{ runner.temp }}/screens
        run: |
          # Check the critical shared-data/auth paths first, then all remaining tests once.
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=chromium household-google-v40 household-sync-v37
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=chromium --grep-invert 'household-(google-v40|sync-v37)\.spec\.cjs'
          # Work 7th: Japan time as well as UTC, for the test runner and the browser alike (Work tests in Japan).
          TZ=Asia/Tokyo E2E_TZ=Asia/Tokyo npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=chromium date-boundary-v51.spec.cjs stock-levels-v51.spec.cjs prep-sets-v51.spec.cjs
      - name: Safe trial as shipped (built, served from another path, photo flow, no outside requests)
        run: |
          rm -rf /tmp/safe-trial && mkdir -p /tmp/safe-trial/some/other
          ATOKORE_BUILD_SHA="$GITHUB_SHA" python3 -I scripts/atokore/build-safe-trial.py atokore-live-v125 /tmp/safe-trial/some/other/review 19
          node scripts/atokore/check-safe-trial.cjs /tmp/safe-trial some/other/review
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atokore-v19-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  # The full suite contains 542 browser cases; running Chromium+WebKit serially
  # on one runner hits the 25-minute timeout near its end (537/542 passed).
  # Keep both browser gates, but execute them on isolated free public-repo runners.
  # This adds no deployment, no credentials and no production database access.
  # Work 8th: the reproductions of the 8th acceptance in WebKit, 20 effective repeats each, on their own runner
  # (the main WebKit job is near its time limit). Same pinned image; no credentials, no deployment.
  test-webkit-work8:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: npm install --no-save --ignore-scripts jsdom@26.1.0 @playwright/test@1.56.1 @electric-sql/pglite@0.5.8
      - name: WebKit — Work 8th reproductions (multi-tab merge, unknown-origin prep data, offline purchase undo, re-purchase forecast), 20 repeats each
        run: |
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit multitab-v51.spec.cjs prep-origin-v51.spec.cjs --repeat-each=20
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit undo-race-v51.spec.cjs --grep '\(Work 8th\): bought offline|forecast \(Work 8th\)' --repeat-each=20
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit journal-v51.spec.cjs --repeat-each=20
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit undo-race-v51.spec.cjs --grep 'shopping page \(Work 9th\)' --repeat-each=20
          TZ=Asia/Tokyo E2E_TZ=Asia/Tokyo npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit undo-race-v51.spec.cjs --grep 'shopping page \(Work 9th\)' --repeat-each=20

  test-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: npm install --no-save --ignore-scripts jsdom@26.1.0 @playwright/test@1.56.1 @electric-sql/pglite@0.5.8
      - name: Real-browser tests (WebKit / iPhone simulator)
        env:
          E2E_SCREEN_DIR: ${{ runner.temp }}/screens
        run: |
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit household-google-v40 household-sync-v37
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit --grep-invert 'household-(google-v40|sync-v37)\.spec\.cjs'
      - name: WebKit — shopping-page undo of A and B in both answer orders, 20 repeats each (Work 7th/8th), and the JST/UTC date boundary
        run: |
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit undo-race-v51.spec.cjs --grep 'shopping-page|shopping page \(Work 8th\)' --repeat-each=20
          TZ=Asia/Tokyo E2E_TZ=Asia/Tokyo npx playwright test -c tests/e2e-v19/playwright.config.cjs --project=webkit date-boundary-v51.spec.cjs stock-levels-v51.spec.cjs
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atokore-v19-webkit-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
