name: Atokore v19 Trial Checks

on:
  push:
    branches: ['claude/atokore-v19-p0-source', 'codex/atokore-polish-v44', 'codex/atokore-muse-v45', 'codex/atokore-followup-v46']
  pull_request:
    paths:
      - 'atokore-live-v125/**'
      - 'scripts/atokore/**'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/atokore-v19-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atokore_ci
          POSTGRES_PASSWORD: atokore-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts pg@8.16.3
      - name: Real PostgreSQL lock and revocation races
        env:
          ATOKORE_SQL_TEST_DATABASE_URL: postgresql://postgres:atokore-ci-only@127.0.0.1:5432/atokore_ci
        run: node tests/household/revocation-postgres.cjs
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Same Playwright/browser versions as the npm package, with dependencies preinstalled.
      # The image digest is pinned so an upstream tag update cannot change the release gate.
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          npm install --no-save --ignore-scripts jsdom@26.1.0 @playwright/test@1.56.1 @electric-sql/pglite@0.5.8
      - name: Syntax and unit regressions
        run: |
          for f in atokore-live-v125/*.js; do node --check "$f"; done
          python3 -I scripts/atokore/build-preview.py atokore-live-v125 "$RUNNER_TEMP/v19-build" 19
          node tests/atokore-core.test.cjs
          node --test tests/atokore-product-identity.test.cjs
          node --test tests/atokore-product-photos-v30.test.cjs
          node --test tests/atokore-baby-food-v35.test.cjs
          node --test tests/atokore-batch-review-v36.test.cjs
          node --test --test-concurrency=1 tests/atokore-household-core.test.cjs tests/atokore-household-sync.test.cjs tests/atokore-household-sql.test.cjs tests/atokore-entitlements-sql.test.cjs tests/atokore-history-w2-sql.test.cjs tests/atokore-household-guest-v42.test.cjs
          node --test tests/atokore-household-google-v40.test.cjs
          node --test tests/atokore-home-v43.test.cjs tests/atokore-polish-v44.test.cjs tests/atokore-muse-v45.test.cjs
          node tests/atokore-actions.integration.test.cjs
          node tests/atokore-receipt-input.test.cjs
          node tests/atokore-receipt-product-names.test.cjs
          node --test tests/atokore-receipt-match-v38.test.cjs
          node tests/atokore-pwa.test.cjs
          node --test tests/atokore-routine-catalog-v20.test.cjs
          node --test tests/atokore-routine-stock-one-tap.test.cjs
          node --test tests/atokore-no-native-confirm.test.cjs
          node --test tests/atokore-search-v48.test.cjs
          node --test tests/atokore-stock-rules-v48.test.cjs
          node --test tests/atokore-quick-add.test.cjs tests/atokore-peach-ui.test.cjs tests/atokore-baby-visuals.test.cjs \
            tests/atokore-mobile-dom.test.cjs tests/atokore-distinct-icons.test.cjs tests/atokore-edit-after-add.test.cjs \
            tests/atokore-baby-focus-v17.test.cjs tests/atokore-add-clarity-v18.test.cjs \
            tests/atokore-storage-bootstrap-v19.test.cjs
      - name: Real-browser tests (Chromium + WebKit)
        env:
          E2E_SCREEN_DIR: ${{ runner.temp }}/screens
        run: |
          # Check the critical shared-data/auth paths first, then all remaining tests once.
          npx playwright test -c tests/e2e-v19/playwright.config.cjs household-google-v40 household-sync-v37
          npx playwright test -c tests/e2e-v19/playwright.config.cjs --grep-invert 'household-(google-v40|sync-v37)\.spec\.cjs'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atokore-v19-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
