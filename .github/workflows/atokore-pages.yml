name: Deploy Atokore Pages

on:
  push:
    branches: [main]
    paths:
      - 'atokore-live-v125/**'
      - 'atokore-trial-v12/family.js'
      - 'tests/atokore-core.test.cjs'
      - 'tests/atokore-actions.integration.test.cjs'
      - 'tests/atokore-receipt-input.test.cjs'
      - '.github/workflows/atokore-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify Atokore v12.5h
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R atokore-live-v125/. _site/
          cp atokore-trial-v12/family.js _site/family.js
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site')
          index = (root / 'index.html').read_text()
          actions = (root / 'stability.js').read_text()
          receipt = (root / 'receipt.js').read_text()
          ui = (root / 'ui.js').read_text()

          assert '試用版 v12.5h' in index
          assert 'final.css?v=125h' in index
          assert index.count('stability.js?v=125h') == 1
          assert 'selectionfix.js' not in index
          assert 'family.js?v=125h' in index
          assert 'location.replace' not in index
          assert "window.__atokoreActionOwner=ACTION_OWNER" in actions
          assert "const ACTION_OWNER='stability-v125h'" in actions
          assert 'buyOneToStockV125H' in actions
          assert 'id="receiptCamera"' in receipt
          assert 'id="receiptFile"' in receipt
          assert 'selectedBuyIdsV125f' not in actions
          assert "'&quot;'" in ui

          for src in re.findall(r'<script[^>]+src="([^"]+)"', index):
              path = src.split('?', 1)[0].removeprefix('./')
              assert (root / path).is_file(), f'missing script: {path}'
          for href in re.findall(r'<link[^>]+href="([^"]+)"', index):
              path = href.split('?', 1)[0].removeprefix('./')
              assert (root / path).is_file(), f'missing stylesheet: {path}'
          PY

          node --check _site/receipt.js
          node --check _site/display.js
          node --check _site/bulk.js
          node --check _site/history.js
          node --check _site/ui.js
          node --check _site/stability.js
          node --check _site/family.js
          node tests/atokore-core.test.cjs
          node tests/atokore-actions.integration.test.cjs
          node tests/atokore-receipt-input.test.cjs

          mkdir -p _site/atokore
          find _site -maxdepth 1 -type f ! -name '.nojekyll' -exec cp {} _site/atokore/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
