name: Deploy Atokore Pages

on:
  push:
    branches: [main]
    paths:
      - 'atokore-live-v125/**'
      - 'atokore-trial-v12/family.js'
      - '.github/workflows/atokore-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root GitHub Pages app
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R atokore-live-v125/. _site/
          cp atokore-trial-v12/family.js _site/family.js
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          family='<script src="./family.js?v=gh-root-1"></script>'
          if family not in s:
              s=s.replace('</body>', family+'<script>document.querySelector(".badge")&&(document.querySelector(".badge").textContent="試用版 v12.5 + 家族共有");</script></body>')
          p.write_text(s)
          assert 'location.replace' not in s, 'root must be the app itself, not a redirect'
          assert 'family.js?v=gh-root-1' in s
          assert 'stability.js?v=125' in s
          assert 'selectionfix.js?v=125' in s
          PY

          node --check _site/receipt.js
          node --check _site/display.js
          node --check _site/bulk.js
          node --check _site/history.js
          node --check _site/ui.js
          node --check _site/stability.js
          node --check _site/selectionfix.js
          node --check _site/family.js

          mkdir -p _site/atokore
          find _site -maxdepth 1 -type f ! -name '.nojekyll' -exec cp {} _site/atokore/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
