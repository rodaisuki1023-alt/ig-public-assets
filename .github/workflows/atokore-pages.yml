name: Deploy Atokore Pages

on:
  push:
    branches: [main]
    paths:
      - 'atokore-live-v125/**'
      - 'atokore-trial-v12/family.js'
      - 'tests/atokore-core.test.cjs'
      - 'tests/atokore-actions.integration.test.cjs'
      - 'tests/atokore-receipt-input.test.cjs'
      - 'tests/atokore-receipt-product-names.test.cjs'
      - 'tests/atokore-pwa.test.cjs'
      - 'tests/atokore-xss.test.cjs'
      - '.github/workflows/atokore-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the reviewed draft to one SHA, so routine app deployments cannot
      # silently change the preview content.
      - name: Checkout reviewed compact UI draft
        uses: actions/checkout@v4
        with:
          ref: 9a6287f014203a1199303c03b4661f14c2897847
          path: _preview_source
          persist-credentials: false

      - name: Build and verify Atokore v12.5m PWA
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R atokore-live-v125/. _site/
          cp atokore-trial-v12/family.js _site/family.js
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site')
          index = (root / 'index.html').read_text()
          actions = (root / 'stability.js').read_text()
          receipt = (root / 'receipt.js').read_text()
          ui = (root / 'ui.js').read_text()
          history = (root / 'history.js').read_text()
          family = (root / 'family.js').read_text()
          pwa = (root / 'pwa.js').read_text()
          worker = (root / 'service-worker.js').read_text()

          assert '試用版 v12.5m' in index
          assert 'final.css?v=125m' in index
          assert index.count('stability.js?v=125m') == 1
          assert 'selectionfix.js' not in index
          assert 'family.js?v=125m' in index
          assert 'location.replace' not in index
          assert "window.__atokoreActionOwner=ACTION_OWNER" in actions
          assert "const ACTION_OWNER='stability-v125h'" in actions
          assert 'buyOneToStockV125H' in actions
          assert 'id="receiptCamera"' in receipt
          assert 'id="receiptFile"' in receipt
          assert 'window.__atokoreReceiptV125M' in receipt
          assert 'tessedit_pageseg_mode' in receipt
          assert 'tsv:true' in receipt
          assert '要確認・未選択' in receipt
          assert '商品名と数量だけを読み取り、小計で終了します' in receipt
          assert 'stoppedAtSubtotal' in receipt
          assert 'receiptCompactTop' in receipt
          assert 'receiptItemDetails' in receipt
          assert 'receiptSelectAllV7' in receipt
          assert '通常は商品名と数量だけ確認してください' in receipt
          assert '購入単価' not in receipt
          assert 'レシート金額' not in receipt
          assert 'selectedBuyIdsV125f' not in actions
          assert 'stableManageBtns.hide' in actions
          assert 'del.disabled=!count' in actions
          assert 'premiumIntroV125m' in ui
          assert 'catalogLimit=6' in ui
          assert "tab==='activity'&&load().length" in history
          assert 'familyModeTabs' in family
          assert '#receiptAnalyzeBtn:disabled' in receipt
          assert "'&quot;'" in ui
          assert 'rel="manifest" href="./manifest.webmanifest"' in index
          assert 'rel="apple-touch-icon" href="./icons/icon-180.png"' in index
          assert 'name="apple-mobile-web-app-capable" content="yes"' in index
          assert 'atokore-theme.css?v=13' in index
          assert 'atokore-redesign.js?v=13' in index
          assert 'quick-add.css?v=14' in index
          assert 'quick-add.js?v=14' in index
          assert "'./quick-add.js'" in worker
          assert "'./quick-add.css'" in worker
          assert "'./atokore-redesign.js'" in worker
          assert "'./atokore-theme.css'" in worker
          assert 'baby-visuals.js?v=bv1' in index
          assert (root / 'baby-visuals.js').is_file()
          assert "'./baby-visuals.js'" in worker
          assert 'pwa.js?v=pwa1' in index
          assert "serviceWorker.register('./service-worker.js'" in pwa
          assert "const CACHE_VERSION = 'atokore-pwa-v15'" in worker
          assert 'function ownsPath(' in worker
          assert 'function safeId(' in index

          manifest = __import__('json').loads((root / 'manifest.webmanifest').read_text())
          assert manifest['name'] == 'あとこれ｜家庭の在庫・買い物リスト'
          assert manifest['display'] == 'standalone'
          assert manifest['start_url'] == './?source=pwa'
          for icon in ['icon-180.png', 'icon-192.png', 'icon-512.png']:
              assert (root / 'icons' / icon).is_file(), f'missing PWA icon: {icon}'

          for src in re.findall(r'<script[^>]+src="([^"]+)"', index):
              path = src.split('?', 1)[0].removeprefix('./')
              assert (root / path).is_file(), f'missing script: {path}'
          for href in re.findall(r'<link[^>]+href="([^"]+)"', index):
              path = href.split('?', 1)[0].removeprefix('./')
              assert (root / path).is_file(), f'missing stylesheet: {path}'
          PY

          node --check _site/receipt.js
          node --check _site/display.js
          node --check _site/bulk.js
          node --check _site/history.js
          node --check _site/ui.js
          node --check _site/stability.js
          node --check _site/family.js
          node --check _site/pwa.js
          node --check _site/service-worker.js
          node --check _site/baby-visuals.js
          node --check _site/atokore-redesign.js
          node --check _site/quick-add.js
          npm install --no-save --ignore-scripts jsdom@26.1.0 @electric-sql/pglite@0.5.8
          node --test tests/atokore-quick-add.test.cjs
          node --test tests/atokore-peach-ui.test.cjs
          node --test tests/atokore-baby-visuals.test.cjs
          node tests/atokore-core.test.cjs
          node tests/atokore-actions.integration.test.cjs
          node tests/atokore-receipt-input.test.cjs
          node tests/atokore-receipt-product-names.test.cjs
          node tests/atokore-pwa.test.cjs
          node --test tests/atokore-xss.test.cjs

          mkdir -p _site/atokore
          find _site -maxdepth 1 -type f ! -name '.nojekyll' -exec cp {} _site/atokore/ \;
          cp -R _site/icons _site/atokore/icons

      - name: Build safely isolated mobile trial
        run: |
          set -eu
          PREVIEW=_site/preview-compact-v15
          mkdir -p "$PREVIEW"
          cp -R _preview_source/atokore-live-v125/. "$PREVIEW/"
          # Family peer sync is purposely disabled in this review copy.
          # Do not allow review interactions to modify real family stock.
          printf '/* Preview only: family sync is intentionally disabled. */\n' > "$PREVIEW/family.js"

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('_site/preview-compact-v15')
          for path in [root / 'index.html', *root.glob('*.js')]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('atokoreTrialV4', 'atokorePreviewTrialV15')
              text = text.replace('atokoreHistoryV1', 'atokorePreviewHistoryV15')
              path.write_text(text, encoding='utf-8')
          index = (root / 'index.html').read_text()
          worker = (root / 'service-worker.js').read_text()
          assert 'quick-add.js?v=15' in index
          assert 'product-icons.js?v=15' in index
          assert 'compact-add.css?v=15' in index
          assert 'atokorePreviewTrialV15' in index
          assert 'atokoreTrialV4' not in ''.join(p.read_text() for p in root.glob('*.js'))
          assert 'atokore-pwa-v15' in worker
          assert "Preview only: family sync" in (root / 'family.js').read_text()
          for path_str in re.findall(r'<script[^>]+src="([^"]+)"', index):
              path = path_str.split('?',1)[0].removeprefix('./')
              assert (root / path).is_file(), f'missing preview script: {path}'
          for path_str in re.findall(r'<link[^>]+href="([^"]+)"', index):
              path = path_str.split('?',1)[0].removeprefix('./')
              assert (root / path).is_file(), f'missing preview asset: {path}'
          PY

          node --check "$PREVIEW/quick-add.js"
          node --check "$PREVIEW/product-icons.js"
          node --check "$PREVIEW/atokore-redesign.js"
          node --test _preview_source/tests/atokore-distinct-icons.test.cjs
          node --test _preview_source/tests/atokore-quick-add.test.cjs

      - name: Checkout reviewed edit-after-add version
        uses: actions/checkout@v4
        with:
          ref: 5e5a125b91311abee5293618304346d345b4d64d
          path: _preview_simple_source
          persist-credentials: false

      - name: Build isolated simpler registration trial
        run: |
          set -eu
          PREVIEW=_site/preview-simple-v16
          mkdir -p "$PREVIEW"
          cp -R _preview_simple_source/atokore-live-v125/. "$PREVIEW/"
          # Trial mode must never modify the production family inventory.
          printf '/* v16 preview only: family sync is intentionally disabled. */\n' > "$PREVIEW/family.js"
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('_site/preview-simple-v16')
          for path in [base/'index.html',*base.glob('*.js')]:
              t=path.read_text(encoding='utf-8')
              t=t.replace('atokoreTrialV4','atokorePreviewTrialV16')
              t=t.replace('atokoreHistoryV1','atokorePreviewHistoryV16')
              if path.name=='index.html':
                  t=t.replace('試用版 v12.5m','新しい試用版 v16')
              path.write_text(t,encoding='utf-8')
          index=(base/'index.html').read_text()
          worker=(base/'service-worker.js').read_text()
          assert 'edit-after-add.js?v=16' in index
          assert 'edit-after-add.css?v=16' in index
          assert 'quick-add.js?v=16' in index
          assert 'product-icons.js?v=15' in index
          assert 'atokorePreviewTrialV16' in index
          assert 'atokoreTrialV4' not in ''.join(p.read_text() for p in base.glob('*.js'))
          assert "family sync is intentionally disabled" in (base/'family.js').read_text()
          assert "atokore-pwa-v16" in worker
          for ref in re.findall(r'<script[^>]+src="([^"]+)"',index)+re.findall(r'<link[^>]+href="([^"]+)"',index):
              name=ref.split('?',1)[0].removeprefix('./')
              assert (base/name).is_file(),f'missing preview asset: {name}'
          PY
          node --check "$PREVIEW/edit-after-add.js"
          node --check "$PREVIEW/quick-add.js"
          node --test _preview_simple_source/tests/atokore-edit-after-add.test.cjs
          node --test _preview_simple_source/tests/atokore-distinct-icons.test.cjs
          node --test _preview_simple_source/tests/atokore-quick-add.test.cjs

      - name: Checkout reviewed baby-focused trial source
        uses: actions/checkout@v4
        with:
          ref: ef6a47ace8ff7f88ded1d2b4a2216f043dca51be
          path: _preview_baby_source
          persist-credentials: false

      - name: Build baby-focused isolated iPhone trial
        run: |
          set -eu
          PREVIEW=_site/preview-baby-v17
          mkdir -p "$PREVIEW"
          cp -R _preview_baby_source/atokore-live-v125/. "$PREVIEW/"
          # The isolated trial never joins or mutates a real family's shared data.
          printf '/* v17 preview only: family sync is intentionally disabled. */\n' > "$PREVIEW/family.js"

          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('_site/preview-baby-v17')
          for path in [base/'index.html',*base.glob('*.js')]:
              content=path.read_text(encoding='utf-8')
              content=content.replace('atokoreTrialV4','atokorePreviewTrialV17')
              content=content.replace('atokoreHistoryV1','atokorePreviewHistoryV17')
              if path.name=='index.html':
                  content=content.replace('試用版 v12.5m','ベビー特化 試用版 v18')
                  # Only the first launch may copy an older trial's data. Keep
                  # the old trial and all production inventory completely unchanged.
                  bootstrap = (
                      '<script>(function(){try{'
                      'if(!localStorage.getItem("atokorePreviewTrialV17")){'
                      'var old=localStorage.getItem("atokorePreviewTrialV16");'
                      'if(old){var data=JSON.parse(old);'
                      'if(data&&Array.isArray(data.items)&&Array.isArray(data.buys)&&Array.isArray(data.routines))'
                      'localStorage.setItem("atokorePreviewTrialV17",old);}}'
                      'if(!localStorage.getItem("atokorePreviewHistoryV17")){'
                      'var history=localStorage.getItem("atokorePreviewHistoryV16");'
                      'if(history)localStorage.setItem("atokorePreviewHistoryV17",history);}'
                      '}catch(e){}})();</script>'
                  )
                  assert '</head>' in content
                  content=content.replace('</head>',bootstrap+'</head>',1)
              path.write_text(content,encoding='utf-8')

          html=(base/'index.html').read_text()
          worker=(base/'service-worker.js').read_text()
          assert 'baby-kit-v17.js?v=17' in html
          assert 'baby-flow-v17.js?v=18' in html
          assert 'baby-focus-v17.css?v=17' in html
          assert 'quick-add.js?v=18' in html
          assert 'add-clarity-v18.css?v=18' in html
          assert 'atokorePreviewTrialV17' in html
          assert 'atokorePreviewTrialV16' in html  # one-time copy of existing trial only
          assert 'atokoreTrialV4' not in ''.join(p.read_text() for p in base.glob('*.js'))
          assert 'family sync is intentionally disabled' in (base/'family.js').read_text()
          assert "atokore-pwa-v18" in worker
          for ref in re.findall(r'<script[^>]+src="([^"]+)"',html)+re.findall(r'<link[^>]+href="([^"]+)"',html):
              file=base/ref.split('?',1)[0].removeprefix('./')
              assert file.is_file(),f'missing baby preview resource: {file}'
          PY

          node --check "$PREVIEW/quick-add.js"
          node --check "$PREVIEW/baby-kit-v17.js"
          node --check "$PREVIEW/baby-flow-v17.js"
          node --test _preview_baby_source/tests/atokore-baby-focus-v17.test.cjs
          node --test _preview_baby_source/tests/atokore-add-clarity-v18.test.cjs
          node --test _preview_baby_source/tests/atokore-quick-add.test.cjs
          node --test _preview_baby_source/tests/atokore-edit-after-add.test.cjs
          node --test _preview_baby_source/tests/atokore-distinct-icons.test.cjs

      - name: Checkout reviewed v19 P0 safety trial source
        uses: actions/checkout@v4
        with:
          ref: 39fb342e8c3bd1ef1a6a12e4d5dbd1e52e0c723e
          path: _preview_v19_source
          persist-credentials: false

      - name: Build v19 safety trial (separate storage, no family sync)
        run: |
          set -eu
          PREVIEW=_site/preview-baby-v19
          # The trial's own build script renames every storage key to atokorePreview*V19, stubs
          # family sync and fails if a production key or a referenced file is missing.
          python3 -I _preview_v19_source/scripts/atokore/build-preview.py \
            _preview_v19_source/atokore-live-v125 "$PREVIEW" 19
          python3 - <<'PY'
          from pathlib import Path
          base = Path('_site/preview-baby-v19')
          html = (base / 'index.html').read_text()
          worker = (base / 'service-worker.js').read_text()
          bootstrap = (base / 'storage-bootstrap-v19.js').read_text()
          assert 'ベビー特化 試用版 v19' in html
          assert 'polish-v44.js?v=47' in html and 'polish-v44.css?v=44' in html
          assert "'./polish-v44.js'" in worker and "'./polish-v44.css'" in worker
          assert 'common-v45.js?v=46' in html and 'insights-v45.js?v=47' in html and 'muse-v45.css?v=45' in html
          for asset in ['common-v45.js','insights-v45.js','muse-v45.css']:
              assert f"'./{asset}'" in worker
          assert 'AtokoreConfirm.open' in (base / 'stability.js').read_text()
          assert '写真なし・詳細一覧' in (base / 'polish-v44.js').read_text()
          assert 'home-v43.js?v=45' in html and 'home-v43.css?v=43' in html
          assert "'./home-v43.js'" in worker and "'./home-v43.css'" in worker
          assert '家族の最近の変更' in (base / 'home-v43.js').read_text()
          assert 'history.js?v=47' in html
          assert '機能更新 v47' in (base / 'insights-v45.js').read_text()
          assert "{v:'v47'" in (base / 'history.js').read_text()
          assert 'storage-bootstrap-v19.js' in html and 'data-safety-v19.js' in html and 'p0-fixes-v19.css' in html
          assert 'atokorePreviewTrialV19' in bootstrap
          assert 'atokorePreviewTrialV17' in bootstrap  # one-time copy of the v17 trial only
          assert '__atokoreStorageLock' in bootstrap  # unreadable data that cannot be set aside locks saving
          assert 'routine-catalog-v20.js?v=47' in html
          assert 'routine-catalog-v20.css?v=24' in html
          assert 'routine-catalog-v20.js' in worker
          assert '商品を選ぶ' in (base / 'routine-catalog-v20.js').read_text()
          assert 'openRoutinePicker' in (base / 'routine-catalog-v20.js').read_text()
          quick_text = (base / 'quick-add.js').read_text()
          # v36: pending products are saved only from the review screen (it replaces the routine dialog).
          assert 'function openReview(' in quick_text and 'data-qa-review' in quick_text and '!state.reviewing' in quick_text
          assert 'revealStock' in (base / 'baby-flow-v17.js').read_text()
          assert 'batch-review-v36.css?v=36' in html and "'./batch-review-v36.css'" in worker
          assert 'atkRoutineBuyCommit' in (base / 'routine-catalog-v20.js').read_text()
          assert 'atk-routine-stock-mode' in (base / 'routine-catalog-v20.css').read_text()
          assert 'baby-flow-v17.js?v=47' in html
          assert 'baby-kit-v17.js?v=33' in html
          assert 'baby-food-catalog-v35.js?v=35' in html
          assert 'baby-food-catalog-v35.js' in worker
          assert '離乳食' in (base / 'baby-food-catalog-v35.js').read_text()
          assert 'baby-focus-v17.css?v=35' in html
          assert 'decorateStockCards' in (base / 'baby-flow-v17.js').read_text()
          assert 'bf-stock-grid' in (base / 'baby-focus-v17.css').read_text()
          assert 'brandAppearance' in (base / 'baby-kit-v17.js').read_text()
          assert 'product-photos-v30.js?v=44' in html and 'product-photos-v30.css?v=31' in html
          assert 'atokore-redesign.js?v=45' in html and 'edit-after-add.js?v=45' in html
          photos = (base / 'product-photos-v30.js').read_text()
          assert 'atokorePreviewProductPhotosV19' in photos and 'indexedDB.open' in photos
          assert 'localStorage.setItem' not in photos and 'fetch(' not in photos
          assert "'./product-photos-v30.js'" in worker and "'./product-photos-v30.css'" in worker
          assert 'quick-add.js?v=46' in html
          assert 'quick-add.css?v=27' in html
          quick = (base / 'quick-add.js').read_text()
          assert 'groupsFor' in quick and 'subgroupOf' in quick and 'isBabyFood' in quick
          assert 'bfStockHouseholdFilters' in (base / 'baby-flow-v17.js').read_text()
          assert 'MILK_PRODUCTS' in quick and 'customBrand' in quick and 'グローアップミルク' in quick
          assert "'カークランド','Rico','baby care'" in quick
          for name in ['diaper-bear-v24', 'wipes-bear-v24', 'milk-bear-v26']:
              image = f'icons/baby/{name}.webp'
              assert (base / image).is_file() and image in worker
          assert 'stability.js?v=46' in html
          assert 'sameProduct(x,bought)' in (base / 'stability.js').read_text()
          assert '＋ ストックに追加' in (base / 'baby-flow-v17.js').read_text()
          assert '追加してもいいですか？' in (base / 'baby-flow-v17.js').read_text()
          assert '追加してもいいですか？' in (base / 'routine-catalog-v20.js').read_text()
          assert 'function ownsPath(' in worker and "CACHE_VERSION = 'atokore-pwa-v47'" in worker
          # Dedicated trial backend; Google sign-in remains explicit and preserves pre-load overrides.
          config = (base / 'household-config-v37.js').read_text()
          assert "Object.prototype.hasOwnProperty.call(window, 'ATOKORE_HOUSEHOLD_CONFIG')" in config
          assert "url: 'https://vzyxurodowpjltwbgbyc.supabase.co'" in config
          assert "anonKey: 'sb_publishable_" in config
          assert 'google: true' in config and 'email: false' in config and 'guest: true' in config
          sync = (base / 'household-sync-v37.js').read_text()
          assert 'atokorePreviewHouseholdSyncV19' in sync and 'atokorePreviewHouseholdSessionV19' in sync
          for name, version in [('household-config-v37.js', 42), ('household-core-v37.js', 40), ('household-sync-v37.js', 45), ('household-sync-v37.css', 37), ('household-google-v40.js', 40)]:
              assert name + f'?v={version}' in html and f"'./{name}'" in worker, name
          assert 'atokorePreviewHouseholdInviteV19' in sync
          assert 'Googleなしで共有に参加する' in sync and 'recoveryHelp' in sync
          assert 'atokorePreviewHouseholdOAuthV19' in (base / 'household-google-v40.js').read_text()
          assert 'sync_rejected' in (base / 'household-core-v37.js').read_text()
          # No server secrets in the browser: only the public anon key could ever be configured.
          built = ''.join(p.read_text() for p in base.glob('*.js'))
          assert 'service_role' not in built and 'sb_secret_' not in built
          # v38 receipts: pinned on-device OCR, suggestions, receipt history on trial-only storage.
          receipt_js = (base / 'receipt.js').read_text()
          assert 'receipt.js?v=46' in html and 'tesseract.js@5.1.1' in receipt_js
          assert 'どの商品ですか？' in receipt_js and '読み取れなかった行' in receipt_js
          assert 'atokorePreviewReceiptHistoryV19' in receipt_js
          assert 'receipt-match-v38.js?v=38' in html and 'receipt-v38.css?v=38' in html
          assert "'./receipt-match-v38.js'" in worker and "'./receipt-v38.css'" in worker
          # v39 first run and reorder line.
          onboarding = (base / 'onboarding-v39.js').read_text()
          assert 'onboarding-v39.js?v=43' in html and 'onboarding-v39.css?v=39' in html
          assert 'atokorePreviewOnboardingV19' in onboarding and 'atokorePreviewTrialV19' in onboarding
          assert "'./onboarding-v39.js'" in worker and "'./onboarding-v39.css'" in worker
          assert 'atokoreIsLow' in (base / 'atokore-redesign.js').read_text()
          assert 'name="minQty"' in (base / 'edit-after-add.js').read_text()
          assert 'family sync is intentionally disabled' in (base / 'family.js').read_text()
          PY
          for f in "$PREVIEW"/*.js; do node --check "$f"; done
          node --test _preview_v19_source/tests/atokore-add-clarity-v18.test.cjs \
            _preview_v19_source/tests/atokore-baby-focus-v17.test.cjs \
            _preview_v19_source/tests/atokore-quick-add.test.cjs \
            _preview_v19_source/tests/atokore-edit-after-add.test.cjs \
            _preview_v19_source/tests/atokore-distinct-icons.test.cjs \
            _preview_v19_source/tests/atokore-storage-bootstrap-v19.test.cjs \
            _preview_v19_source/tests/atokore-routine-catalog-v20.test.cjs \
            _preview_v19_source/tests/atokore-routine-stock-one-tap.test.cjs \
