name: Atokore Baby Catalog Checks

on:
  pull_request:
    paths:
      - 'atokore-live-v125/catalog/**'
      - 'tests/atokore-baby-catalog.test.cjs'
      - '.github/workflows/atokore-baby-catalog-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-baby-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check atokore-live-v125/catalog/baby-catalog.js
      - name: Baby catalog tests
        run: node --test tests/atokore-baby-catalog.test.cjs
      - name: Existing application regression tests
        run: |
          node tests/atokore-core.test.cjs
          node tests/atokore-actions.integration.test.cjs
          node tests/atokore-receipt-input.test.cjs
          node tests/atokore-receipt-product-names.test.cjs
          node tests/atokore-pwa.test.cjs
