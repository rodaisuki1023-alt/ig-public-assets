<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>あとこれ 試用版 v4</title><link rel="stylesheet" href="app.css"></head><body><div class="app"><header class="top"><h1>あとこれ <span class="badge">試用版 v4</span></h1><div class="sub">家庭のストックを、できるだけ簡単に</div></header><main class="content"><section id="pg-home" class="page on"><div id="homeHero" class="hero"><div class="muted">今日のあとこれ</div><h2 id="heroTitle">今日は急ぎなし</h2><div id="heroText" class="muted"></div></div><div class="metrics"><button class="metric" onclick="go('stock')">⏰<b id="mExp">0</b><span class="muted">期限近い</span></button><button class="metric" onclick="go('buy')">🛒<b id="mBuy">0</b><span class="muted">買うもの</span></button><button class="metric" onclick="showPremium('predict')">✦<b id="mPred">0</b><span class="muted">そろそろ</span></button></div><div class="section">すぐやる</div><div class="quick"><button onclick="go('add')"><strong>＋</strong>ストック追加</button><button onclick="go('buy')"><strong>🛒</strong>買い物メモ</button><button onclick="showPremium('receipt')"><strong>🧾</strong>レシート補充</button></div><div id="urgentWrap"><div class="section">今日優先</div><div id="urgentList"></div></div></section><section id="pg-stock" class="page"><div class="field"><input id="stockSearch" placeholder="品名を検索" oninput="renderStock()"></div><div class="row"><div class="grow"><div class="name">在庫からまとめて買い物へ</div><div class="meta">複数の商品を選んで一括追加できます</div></div><button id="stockSelectToggle" class="btn ghost" onclick="toggleStockSelect()">まとめて選ぶ</button></div><div id="stockBulkActions" class="bulkbar hide"><button class="btn ghost" onclick="selectAllVisible()">表示中を全選択</button><button id="stockBulkMove" class="btn" onclick="moveSelectedToBuy()">選択した0件を買い物へ</button><button class="btn ghost" onclick="clearBulkSelection()">選択解除</button></div><div id="catChips" class="chips"></div><div id="stockList"></div></section><section id="pg-add" class="page"><div class="section">商品を追加</div><div class="field"><div class="label">カテゴリー</div><select id="addCat" onchange="catalogLimit=18;renderCatalog()"><option>食料品</option><option>日用品</option><option>衛生・薬</option><option>ベビー</option><option>子ども</option><option>衣類</option><option>家電・生活用品</option><option>防災</option></select></div><div class="field"><div class="label">商品検索 / 手動入力</div><input id="addName" placeholder="例：牛乳、オムツ" oninput="onNameInput()"></div><div class="catalogHead"><div id="catalogCount" class="catalogCount"></div></div><div id="catalog" class="products"></div><button id="catalogMore" class="btn moreBtn hide" onclick="moreCatalog()">もっと見る</button><div class="field"><div class="label">個数・数量</div><input id="addQty" type="number" min="0" step="1" value="1"></div><div class="field"><div class="label">単位</div><select id="addUnit"><option>個</option><option>本</option><option>袋</option><option>箱</option><option>パック</option><option>枚</option><option>g</option><option>kg</option><option>ml</option><option>L</option></select><div class="muted">商品に合わせて自動選択。肉・魚はg / kgへ変更できます。</div></div><div class="field"><div class="label">期限の種類</div><select id="addExpType" onchange="toggleExp()"><option>期限なし</option><option>賞味期限</option><option>消費期限</option><option>使用期限</option></select></div><div id="addExpWrap" class="field hide"><div class="label">期限日</div><input id="addExp" type="date"></div><details class="detail"><summary>＋ 詳細を入力</summary><div class="field"><div class="label">購入日</div><input id="addPurchase" type="date"></div><div class="field"><div class="label">購入価格</div><input id="addPrice" type="number" placeholder="例：398"></div><div class="field"><div class="label">購入店舗</div><input id="addStore" placeholder="例：イオン"></div><div class="field"><div class="label">保管場所</div><select id="addPlace"><option>冷蔵庫</option><option>冷凍庫</option><option>パントリー</option><option>洗面所</option><option>トイレ</option><option>収納</option><option>防災収納</option><option>その他</option></select></div><div class="field"><div class="label">メモ</div><textarea id="addMemo" rows="2"></textarea></div></details><button class="btn" style="width:100%;margin-top:12px" onclick="registerItem()">この内容で登録</button></section><section id="pg-buy" class="page"><div class="section">買い物リスト</div><div class="row"><div class="grow"><input id="buyName" style="width:100%;border:0;font-size:16px" placeholder="買うものを入力"></div><button class="btn" onclick="addBuy()">追加</button></div><div id="buyList"></div></section><section id="pg-premium" class="page"><div class="section">Premiumを試す</div><div class="row premium" onclick="showPremium('receipt')"><div class="grow"><div class="name">🧾 レシート一括補充</div><div class="meta">デモ解析→在庫反映</div></div>›</div><div class="row premium" onclick="showPremium('predict')"><div class="grow"><div class="name">📈 消費予測</div><div class="meta">そろそろ買い時を提案</div></div>›</div><div class="row premium" onclick="showPremium('qr')"><div class="grow"><div class="name">▦ 収納QR</div><div class="meta">保管場所ごとの在庫確認</div></div>›</div><div class="row premium" onclick="showPremium('money')"><div class="grow"><div class="name">💰 節約レポート</div><div class="meta">在庫金額や節約効果</div></div>›</div></section></main><nav class="tabs"><button class="tab on" data-p="home" onclick="go('home')"><b>⌂</b>ホーム</button><button class="tab" data-p="stock" onclick="go('stock')"><b>📦</b>在庫</button><button class="tab" data-p="add" onclick="go('add')"><b>＋</b>追加</button><button class="tab" data-p="buy" onclick="go('buy')"><b>🛒</b>買い物</button><button class="tab" data-p="premium" onclick="go('premium')"><b>✦</b>Premium</button></nav></div><div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="sheet" class="sheet"></div></div><script src="catalog.js"></script><script src="app.js"></script></body></html>
